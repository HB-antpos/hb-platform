# rd.hotbargain.vip：仅放行 Let's Encrypt HTTP-01 验证路径；其余一律 404。
# 默认站点 hb-edge.conf（仅管理员 IP）保持不变，这里按 server_name 精确匹配优先。
server {
    listen 80;
    server_name rd.hotbargain.vip;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 404;
    }
}
