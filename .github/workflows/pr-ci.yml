name: PR CI

on:
  pull_request:
    branches:
      - main
  # 合并队列：对「main + 队列中排在前面的 PR」组合提交重跑同一套门禁，
  # 必须产出同名 required 检查，否则队列会一直等待。
  merge_group:
    types:
      - checks_requested
  schedule:
    # GitHub cron 使用 UTC；Brisbane 全年 UTC+10，即周日约 02:23。
    - cron: '23 16 * * 6'
  workflow_dispatch:
    inputs:
      profile:
        description: 检查范围与超时预算
        type: choice
        required: true
        default: pr
        options:
          - pr
          - weekly
      component:
        description: 手动运行的组件（weekly 始终全量）
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - web
          - mobile
          - pos-ipad
          - pos-handheld
          - pos-wpf
          - pos-contract
          - supplier-extension
          - supplier-safari
          - antpos-web

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: PR CI / plan
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      budget_seconds: ${{ steps.plan.outputs.budget_seconds }}
      components: ${{ steps.plan.outputs.components }}
      quality_lanes: ${{ steps.plan.outputs.quality_lanes }}
      linux_node_matrix: ${{ steps.plan.outputs.linux_node_matrix }}
      linux_dotnet_matrix: ${{ steps.plan.outputs.linux_dotnet_matrix }}
      windows_matrix: ${{ steps.plan.outputs.windows_matrix }}
      macos_matrix: ${{ steps.plan.outputs.macos_matrix }}
      android_matrix: ${{ steps.plan.outputs.android_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: 验证 CI 编排器
        run: node --test scripts/ci/*.test.mjs scripts/performance/*.test.mjs
      - name: 验证 RustDesk 回滚端口保护
        run: python3 -B -m unittest discover -s scripts/ops/rustdesk -p test_cutover.py
      - name: 生成按路径执行矩阵
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          # 合并队列的 base 是 main 当前提交，head 含队列中排在前面的全部 PR，按组合增量规划。
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          MANUAL_PROFILE: ${{ inputs.profile || 'pr' }}
          MANUAL_COMPONENT: ${{ inputs.component || 'all' }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            node scripts/ci/plan.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --profile pr
          elif [[ "$EVENT_NAME" == "schedule" || "$MANUAL_PROFILE" == "weekly" ]]; then
            node scripts/ci/plan.mjs --full --profile weekly
          elif [[ "$MANUAL_COMPONENT" == "all" ]]; then
            node scripts/ci/plan.mjs --full --profile pr
          else
            node scripts/ci/plan.mjs --component "$MANUAL_COMPONENT" --profile pr
          fi

  linux_node:
    name: PR CI / Node / ${{ matrix.component }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux_node_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      HBPOS_RUN_PERF_TESTS: ${{ needs.plan.outputs.profile == 'weekly' && '1' || '0' }}
      # 现有 Node 测试把“本地日”定义为 Brisbane；限制在 Node lane，避免改变原生/.NET runner。
      TZ: Australia/Brisbane
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 共享迁移门禁直接复核固定基线的归属与语义；双端 lane 必须取得完整历史。
          fetch-depth: ${{ (matrix.component == 'pos-ipad' || matrix.component == 'pos-handheld') && '0' || '1' }}
      - if: matrix.component != 'noop'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/mobile/package-lock.json
            apps/supplier-order-extension/package-lock.json
      - name: 记录组件质量计时起点
        if: contains(fromJSON(needs.plan.outputs.quality_lanes), matrix.component)
        run: >-
          node scripts/performance/quality-lane.mjs start
          --lane '${{ matrix.component }}'
          --state '.artifacts/quality-baseline/${{ matrix.component }}.state.json'
      - name: 执行 Node 组件门禁
        id: verify
        run: ./scripts/ci/run-node-component.sh '${{ matrix.component }}'
      - name: 复用 Web 构建采集包体
        if: matrix.component == 'web'
        run: >-
          node scripts/performance/collect-web-bundle.mjs
          --dist apps/web/dist
          --output .artifacts/quality-baseline/web-bundle.json
      - name: 记录组件质量结果
        if: always() && contains(fromJSON(needs.plan.outputs.quality_lanes), matrix.component)
        env:
          QUALITY_JOB_STATUS: ${{ job.status }}
          QUALITY_VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
        run: >-
          node scripts/performance/quality-lane.mjs finish
          --lane '${{ matrix.component }}'
          --state '.artifacts/quality-baseline/${{ matrix.component }}.state.json'
          --output '.artifacts/quality-baseline/${{ matrix.component }}.json'
          --job-status "$QUALITY_JOB_STATUS"
          --verification-outcome "$QUALITY_VERIFICATION_OUTCOME"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: 上传组件质量结果
        if: always() && contains(fromJSON(needs.plan.outputs.quality_lanes), matrix.component)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-lane-${{ github.run_id }}-${{ matrix.component }}
          path: .artifacts/quality-baseline/${{ matrix.component }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: 上传 Web 包体明细
        if: always() && matrix.component == 'web' && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-web-bundle-${{ github.run_id }}
          path: .artifacts/quality-baseline/web-bundle.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  linux_dotnet:
    name: PR CI / .NET / ${{ matrix.component }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux_dotnet_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: matrix.component != 'noop'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.314
      - if: matrix.component == 'pos-contract'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 记录 Backend 质量计时起点
        if: matrix.component == 'backend'
        run: >-
          node scripts/performance/quality-lane.mjs start
          --lane backend --state .artifacts/quality-baseline/backend.state.json
      - name: 执行 .NET 组件门禁
        id: verify
        run: ./scripts/ci/run-dotnet-component.sh '${{ matrix.component }}'
      - name: 记录 Backend 质量结果
        if: always() && matrix.component == 'backend'
        env:
          QUALITY_JOB_STATUS: ${{ job.status }}
          QUALITY_VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
        run: >-
          node scripts/performance/quality-lane.mjs finish
          --lane backend --state .artifacts/quality-baseline/backend.state.json
          --output .artifacts/quality-baseline/backend.json
          --job-status "$QUALITY_JOB_STATUS"
          --verification-outcome "$QUALITY_VERIFICATION_OUTCOME"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: 上传 Backend 质量结果
        if: always() && matrix.component == 'backend'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-lane-${{ github.run_id }}-${{ matrix.component }}
          path: .artifacts/quality-baseline/backend.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: 上传 .NET 测试结果
        if: always() && matrix.component != 'noop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dotnet-${{ matrix.component }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.component }}
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: PR CI / Windows / ${{ matrix.component }} / ${{ matrix.shard || 'noop' }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: matrix.component != 'noop'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x
            9.0.314
      - name: 构建并测试 WPF
        shell: pwsh
        run: ./scripts/ci/run-windows-component.ps1 -Component '${{ matrix.component }}' -Profile '${{ needs.plan.outputs.profile }}' -Shard '${{ matrix.shard || 'noop' }}'
      - name: 上传 WPF 测试结果
        if: always() && matrix.component != 'noop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ matrix.component }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pos-wpf
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: PR CI / macOS / ${{ matrix.component }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CI_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: matrix.component != 'noop'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/supplier-order-extension/package-lock.json
      - name: 构建并测试 Apple 原生组件
        shell: bash
        run: |
          xcodebuild() {
            local argument
            for argument in "$@"; do
              case "$argument" in
                -list|-version)
                  command xcodebuild "$@"
                  return
                  ;;
              esac
            done

            # ARM hosted runner 只构建原生架构，避免无用的 x86_64 编译与索引开销。
            command xcodebuild "$@" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO
          }
          export -f xcodebuild
          ./scripts/ci/run-macos-component.sh '${{ matrix.component }}'

  android:
    name: PR CI / Android / ${{ matrix.component }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.android_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: matrix.component != 'noop'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - if: matrix.component != 'noop'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: 构建并测试 Android 原生模块
        shell: bash
        run: |
          bash() {
            if [[ "${1:-}" == 'apps/pos-handheld/android/gradlew' ||
                  "${1:-}" == 'apps/mobile/android/gradlew' ]]; then
              # 仅为 CI 的 Gradle 调用分配更高 JVM 上限，并开启可并行的缓存构建。
              command bash "$@" --parallel --build-cache '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g'
              return
            fi
            command bash "$@"
          }
          export -f bash
          ./scripts/ci/run-android-component.sh '${{ matrix.component }}'

  schema_sql:
    name: PR CI / Backend schema SQL
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI_SQL_PASSWORD: HbCi_2026!Safe_Only
      CI_SCHEMA_SQL_CONTAINER_NAME: hbweb-schema-sql-${{ github.run_id }}-${{ github.run_attempt }}
      HBWEB_SCHEMA_SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=HbCi_2026!Safe_Only;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 非 Backend PR 无需运行真实 Schema SQL
        if: ${{ !(github.event_name == 'pull_request' || github.event_name == 'merge_group') || !contains(fromJSON(needs.plan.outputs.components), 'backend') }}
        run: echo 'schema_sql=noop'
      - if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && contains(fromJSON(needs.plan.outputs.components), 'backend') }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.314
      - name: 启动隔离 SQL Server
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && contains(fromJSON(needs.plan.outputs.components), 'backend') }}
        run: >-
          docker run --detach
          --name "$CI_SCHEMA_SQL_CONTAINER_NAME"
          --env ACCEPT_EULA=Y
          --env MSSQL_SA_PASSWORD="$CI_SQL_PASSWORD"
          --publish 1433:1433
          mcr.microsoft.com/mssql/server@sha256:7c29dfbac885ad7519e219c7fe4aee0e67283e21a10e9c252d13b0fbde1866f8
      - name: 运行真实 Schema SQL 门禁
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && contains(fromJSON(needs.plan.outputs.components), 'backend') }}
        run: ./scripts/ci/run-schema-sql.sh
      - name: 上传 Schema SQL 结果
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && contains(fromJSON(needs.plan.outputs.components), 'backend') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema-sql-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema-sql
          if-no-files-found: ignore
          retention-days: 7
      - name: 清理隔离 SQL Server
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && contains(fromJSON(needs.plan.outputs.components), 'backend') }}
        run: |
          if docker inspect "$CI_SCHEMA_SQL_CONTAINER_NAME" >/dev/null 2>&1; then
            docker rm --force "$CI_SCHEMA_SQL_CONTAINER_NAME"
          fi

  quality_report:
    name: PR CI / Quality budget
    needs: [plan, linux_node, linux_dotnet]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # 无质量组件时仍返回真实 noop，required 不接受模糊的 skipped 结果。
      - name: 无质量组件时跳过采集
        if: needs.plan.result != 'success' || needs.plan.outputs.quality_lanes == '[]'
        run: echo 'quality_report=noop'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.plan.result == 'success' && needs.plan.outputs.quality_lanes != '[]'
      - name: 下载组件质量结果
        if: needs.plan.result == 'success' && needs.plan.outputs.quality_lanes != '[]'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: quality-lane-${{ github.run_id }}-*
          path: .artifacts/quality-baseline/lanes
          merge-multiple: true
      - name: 下载 Web 包体明细
        if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.quality_lanes), 'web')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quality-web-bundle-${{ github.run_id }}
          path: .artifacts/quality-baseline/web-bundle
      - name: 汇总复用的质量结果
        if: always() && needs.plan.result == 'success' && needs.plan.outputs.quality_lanes != '[]'
        env:
          QUALITY_EXPECTED_LANES: ${{ needs.plan.outputs.quality_lanes }}
        run: >-
          node scripts/performance/build-metric-batch.mjs
          --results-dir .artifacts/quality-baseline/lanes
          --web-bundle-file .artifacts/quality-baseline/web-bundle/web-bundle.json
          --output .artifacts/quality-baseline/metric-batch-v1.json
          --summary "$GITHUB_STEP_SUMMARY"
      - name: 执行质量预算门禁
        if: always() && needs.plan.result == 'success' && needs.plan.outputs.quality_lanes != '[]'
        run: >-
          node scripts/performance/compare-json-budget.mjs
          --budget quality-baseline-budget.json
          --actual .artifacts/quality-baseline/metric-batch-v1.json
          --selected-lanes '${{ needs.plan.outputs.quality_lanes }}'
          --output .artifacts/quality-baseline/budget-report.json
          --summary "$GITHUB_STEP_SUMMARY"
      - name: 保存质量报告
        if: always() && needs.plan.result == 'success' && needs.plan.outputs.quality_lanes != '[]'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/quality-baseline/lanes/*.json
            .artifacts/quality-baseline/web-bundle/*.json
            .artifacts/quality-baseline/metric-batch-v1.json
            .artifacts/quality-baseline/budget-report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  required:
    # 分支保护只接受 PR 与合并队列事件的稳定检查名；手动/定时运行不得伪造同名成功检查。
    name: >-
      ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group')
          && 'PR CI / required'
          || 'Non-PR CI / matrix required' }}
    if: ${{ always() }}
    needs:
      - plan
      - linux_node
      - linux_dotnet
      - windows
      - macos
      - android
      - schema_sql
      - quality_report
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: 汇总必需检查
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_API_URL: ${{ github.api_url }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          # 预算从 run 开始计时、含 runner 排队；合并队列多组并行构建时排队是常态，
          # 放宽到 45 分钟避免整组被误踢出队列。单 job 的 12 分钟超时仍约束实际执行。
          CI_RUN_BUDGET_SECONDS: ${{ github.event_name == 'merge_group' && '2700' || needs.plan.outputs.budget_seconds }}
          CI_JOB_RESULTS: >-
            {"plan":"${{ needs.plan.result }}","linux_node":"${{ needs.linux_node.result }}","linux_dotnet":"${{ needs.linux_dotnet.result }}","windows":"${{ needs.windows.result }}","macos":"${{ needs.macos.result }}","android":"${{ needs.android.result }}","schema_sql":"${{ needs.schema_sql.result }}","quality_report":"${{ needs.quality_report.result }}"}
        run: node scripts/ci/required-gate.mjs

  weekly_sql:
    name: Weekly full / Backend SQL
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'weekly') }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server@sha256:7c29dfbac885ad7519e219c7fe4aee0e67283e21a10e9c252d13b0fbde1866f8
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: HbCi_2026!Safe_Only
        ports:
          - 1433:1433
          # 成本回填测试只允许此专用端口，继续保留测试中的本机隔离保护。
          - 11439:1433
          # 统计日期会话锁与日统计租约接管测试只允许此专用端口。
          - 15438:1433
    env:
      CI_SQL_PASSWORD: HbCi_2026!Safe_Only
      LOCAL_PURCHASE_DASHBOARD_SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=HbCi_2026!Safe_Only;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30
      PREORDER_SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=HbCi_2026!Safe_Only;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30
      SET_CHILD_PURCHASE_PRICE_SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=HbCi_2026!Safe_Only;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30
      STORE_PRICE_TRANSFER_SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=HbCi_2026!Safe_Only;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30
      # 跨连接锁与成本回填测试读取独立变量；缺失会被 xUnit 跳过并触发 TRX 失败关闭。
      HB_TEST_SQLSERVER_CONNECTION: Server=localhost,1433;User Id=sa;Password=HbCi_2026!Safe_Only;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30
      CONTAINER_MUTATION_SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=HbCi_2026!Safe_Only;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30
