<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HB Supplier Order</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1 id="pageTitle">HB Supplier Order</h1>
      <button id="localeBtn" type="button">EN</button>
    </header>
    <main>
      <section id="apiSection" class="api-settings" hidden>
        <div class="section-heading">
          <label id="apiTitle" for="apiOriginInput">后端接口</label>
          <small id="apiOriginHint"></small>
        </div>
        <div class="api-presets" role="group" aria-labelledby="apiTitle">
          <button id="apiRemoteBtn" type="button">远端 /</button>
          <button id="apiLocalBtn" type="button">本地 5002</button>
        </div>
        <div class="api-origin-row">
          <input id="apiOriginInput" type="url" inputmode="url" spellcheck="false" />
          <button id="apiSaveBtn" type="button">应用</button>
        </div>
      </section>

      <section id="authSection" class="website-session" aria-labelledby="authStatusTitle">
        <div class="website-session-status">
          <span id="authStatusDot" class="session-dot" aria-hidden="true"></span>
          <div class="website-session-copy">
            <strong id="authStatusTitle">正在检查网站登录状态</strong>
            <p id="authStatusDescription">请保持 HB SHOP 登录状态。</p>
          </div>
        </div>
        <div class="website-session-actions">
          <button id="openShopBtn" type="button">打开 HB SHOP</button>
          <button id="recheckBtn" type="button">重新检查</button>
        </div>
      </section>

      <section id="userSection" class="website-session connected" hidden>
        <div class="website-session-status">
          <span class="session-dot" aria-hidden="true"></span>
          <div class="website-session-copy">
            <strong id="connectedTitle">已连接网站账号</strong>
            <div id="userInfo"></div>
          </div>
        </div>
        <button id="disconnectBtn" type="button">断开扩展</button>
      </section>

      <section id="storeSection" hidden>
        <label id="storeLabel" for="storeSelect">门店</label>
        <select id="storeSelect" hidden></select>
        <p id="storeEmpty" class="inline-empty" hidden>暂无已启用 POS 的关联门店</p>
        <button id="storeSaveBtn" type="button">保存</button>
      </section>

      <section id="supplierSection" hidden>
        <div class="supplier-heading">
          <h2 id="supplierTitle">供应商</h2>
          <button id="supplierToggleBtn" type="button" hidden>展开已授权</button>
        </div>
        <p id="supplierCollapseHint" class="supplier-collapse-hint" hidden></p>
        <ul id="supplierList"></ul>
      </section>

      <section id="categorySection" class="category-capture" aria-labelledby="categoryTitle" hidden>
        <div class="category-heading">
          <h2 id="categoryTitle">供应商分类采集</h2>
          <small id="categorySupplier"></small>
        </div>
        <p id="categoryUnavailable" class="inline-empty" hidden></p>
        <div id="categoryControls" hidden>
          <label class="category-toggle" for="categoryPassiveToggle">
            <input id="categoryPassiveToggle" type="checkbox" />
            <span id="categoryPassiveLabel">浏览分类页时自动采集</span>
          </label>
          <p id="categoryPassiveHint" class="category-hint"></p>
          <div class="category-actions">
            <button id="categoryCrawlBtn" class="primary" type="button">采集全部分类</button>
            <button id="categoryAbortBtn" type="button" hidden>中止</button>
            <button id="categoryResumeBtn" type="button" hidden>继续</button>
            <button id="categoryRetryBtn" type="button" hidden>重试失败</button>
          </div>
          <p id="categoryCrawlNote" class="category-hint" hidden></p>
          <div id="categoryProgressWrap" class="category-progress" hidden>
            <progress id="categoryProgress" max="1" value="0" aria-labelledby="categoryProgressText"></progress>
            <span id="categoryProgressText"></span>
          </div>
          <p id="categoryStatus" class="category-status" role="status" aria-live="polite"></p>
          <p id="categoryLastRun" class="category-hint"></p>
          <p id="categorySafariHint" class="category-hint" hidden></p>
        </div>
      </section>

      <div id="dataTabs" class="data-tabs" role="tablist" hidden>
        <button id="historyTab" type="button" role="tab" aria-selected="true" aria-controls="itemSection">商品记录</button>
        <button id="rankingTab" type="button" role="tab" aria-selected="false" aria-controls="rankingSection">热销 TOP 30%</button>
      </div>

      <section id="itemSection" role="tabpanel" aria-labelledby="historyTab" hidden>
        <h2 id="itemTitle"></h2>
        <div class="filters">
          <button type="button" data-filter="all" class="active">全部</button>
          <button type="button" data-filter="order">订货</button>
          <button type="button" data-filter="sales">销售</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th id="typeHeading">类型</th>
                <th id="dateHeading">日期</th>
                <th id="orderNoHeading">单号</th>
                <th id="quantityHeading">数量</th>
                <th id="priceHeading">平均价格</th>
              </tr>
            </thead>
            <tbody id="itemBody"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="prevBtn" type="button">上一页</button>
          <span id="pageInfo"></span>
          <button id="nextBtn" type="button">下一页</button>
        </div>
      </section>

      <section id="rankingSection" role="tabpanel" aria-labelledby="rankingTab" aria-busy="false" hidden>
        <div class="ranking-heading">
          <div>
            <h2 id="rankingTitle">供应商热销 TOP 30%</h2>
            <small id="rankingSupplier"></small>
          </div>
          <span id="rankingBadge" class="ranking-badge">TOP 30%</span>
        </div>
        <div class="ranking-supplier-control">
          <label id="rankingSupplierLabel" for="rankingSupplierSelect">供应商</label>
          <select id="rankingSupplierSelect"></select>
        </div>
        <div class="ranking-toolbar">
          <span id="rankingPeriodLabel">统计周期</span>
          <div class="period-buttons" role="group" aria-labelledby="rankingPeriodLabel">
            <button type="button" data-ranking-days="60" class="active">60 天</button>
            <button type="button" data-ranking-days="90">90 天</button>
          </div>
        </div>
        <p id="rankingScope" class="ranking-scope"></p>
        <p id="rankingLegacyHint" class="ranking-legacy-hint" hidden></p>
        <ol id="rankingList" class="ranking-list"></ol>
        <div id="rankingState" class="ranking-state muted" role="status" aria-live="polite" hidden>
          <span id="rankingStateText"></span>
          <button id="rankingRetryBtn" type="button" hidden>重试</button>
        </div>
        <div id="rankingPager" class="ranking-pager" hidden>
          <div class="ranking-pagination-summary">
            <label id="rankingPageSizeLabel" for="rankingPageSizeSelect">每页</label>
            <select id="rankingPageSizeSelect" aria-controls="rankingList">
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
            <span id="rankingPageInfo" aria-live="polite"></span>
          </div>
          <div class="pager ranking-page-actions">
            <button id="rankingPrevBtn" type="button" aria-controls="rankingList">上一页</button>
            <button id="rankingNextBtn" type="button" aria-controls="rankingList">下一页</button>
          </div>
        </div>
        <span id="rankingAnnouncement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>
      </section>

      <section id="storeSalesSection" class="store-sales-section" aria-labelledby="storeSalesTitle" aria-busy="false" hidden>
        <button id="storeSalesBackBtn" class="store-sales-back" type="button">‹ 返回排行榜</button>
        <h2 id="storeSalesTitle" class="store-sales-title">分店销量</h2>
        <div id="storeSalesProduct" class="store-sales-product"></div>
        <p id="storeSalesPeriod" class="store-sales-period"></p>
        <div class="store-sales-summary">
          <span id="storeSalesTotalLabel">全公司总销量</span>
          <strong id="storeSalesTotal">0</strong>
          <span id="storeSalesStoreCount">0 家分店</span>
        </div>
        <label class="store-sales-search">
          <span class="visually-hidden" id="storeSalesSearchLabel">搜索分店</span>
          <input id="storeSalesSearch" type="search" autocomplete="off" placeholder="搜索分店" />
        </label>
        <div class="store-sales-table-heading" aria-hidden="true">
          <span id="storeSalesStoreHeading">分店</span>
          <span id="storeSalesQuantityHeading">销量 ↓</span>
        </div>
        <ul id="storeSalesList" class="store-sales-list"></ul>
        <div id="storeSalesState" class="ranking-state muted" role="status" aria-live="polite" hidden>
          <span id="storeSalesStateText"></span>
          <button id="storeSalesRetryBtn" type="button" hidden>重试</button>
        </div>
        <p id="storeSalesHelper" class="store-sales-helper" hidden></p>
        <div id="storeSalesFooter" class="store-sales-footer" hidden>
          <span id="storeSalesFooterLabel"></span>
          <strong id="storeSalesFooterTotal">0</strong>
        </div>
        <span id="storeSalesAnnouncement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
