# rd.hotbargain.vip 的 WSS 入口：终止 TLS，只反代 RustDesk 的两个 WebSocket 路径，其余一律 404。
# /ws/id -> hbbs 21118；/ws/relay -> hbbr 21119（均只监听 127.0.0.1）。
map $http_upgrade $rd_connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    server_name rd.hotbargain.vip;

    ssl_certificate     /etc/letsencrypt/live/rd.hotbargain.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rd.hotbargain.vip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/rd_wss_access.log;

    location = /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rd_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rd_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
