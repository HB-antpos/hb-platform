    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.314
      - name: 运行独立 SQL Server 集成测试
        run: ./scripts/ci/run-weekly-sql.sh
      - name: 上传 Weekly SQL 结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-sql-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly-sql
          if-no-files-found: ignore
          retention-days: 14

  weekly_performance:
    name: Weekly full / POS API performance
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'weekly') }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.314
      - name: 采集性能测试结果
        run: ./scripts/ci/run-weekly-performance.sh
      - name: 上传 Weekly 性能结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-performance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly-performance
          if-no-files-found: ignore
          retention-days: 14

  weekly_required:
    name: Weekly full / required
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'weekly')) }}
    needs:
      - plan
      - required
      - weekly_sql
      - weekly_performance
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: 汇总每周全量检查
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_API_URL: ${{ github.api_url }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUN_BUDGET_SECONDS: ${{ needs.plan.outputs.budget_seconds }}
          CI_JOB_RESULTS: >-
            {"required":"${{ needs.required.result }}","weekly_sql":"${{ needs.weekly_sql.result }}","weekly_performance":"${{ needs.weekly_performance.result }}"}
        run: node scripts/ci/required-gate.mjs
