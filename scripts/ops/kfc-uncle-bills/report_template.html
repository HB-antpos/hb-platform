<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uncle Bills 补货信号</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #F5F4EF;
    --surface: #FFFFFF;
    --surface-2: #EDEBE3;
    --ink: #1B1E22;
    --ink-soft: #5B6169;
    --border: #DDD9CE;
    --accent: #0E6B63;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3F0EE;
    --warn: #9A5A0A;
    --warn-bg: #FBEEDD;
    --crit: #A6342F;
    --crit-bg: #FBEAEA;
    --good: #276B43;
    --good-bg: #E8F3EC;
    --series-purchased: #2a78d6;
    --series-sold: #eb6834;
    --shadow: 0 1px 2px rgba(27,30,34,.06), 0 4px 12px rgba(27,30,34,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171A;
      --surface: #1C2024;
      --surface-2: #23282D;
      --ink: #ECEAE3;
      --ink-soft: #A3A9AE;
      --border: #33393F;
      --accent: #3FCFC0;
      --accent-ink: #0B1210;
      --accent-soft: #163430;
      --warn: #E8A94B;
      --warn-bg: #3A2C15;
      --crit: #E8827E;
      --crit-bg: #3A1E1E;
      --good: #6ED39C;
      --good-bg: #17301F;
      --series-purchased: #3987e5;
      --series-sold: #d95926;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171A;
    --surface: #1C2024;
    --surface-2: #23282D;
    --ink: #ECEAE3;
    --ink-soft: #A3A9AE;
    --border: #33393F;
    --accent: #3FCFC0;
    --accent-ink: #0B1210;
    --accent-soft: #163430;
    --warn: #E8A94B;
    --warn-bg: #3A2C15;
    --crit: #E8827E;
    --crit-bg: #3A1E1E;
    --good: #6ED39C;
    --good-bg: #17301F;
    --series-purchased: #3987e5;
    --series-sold: #d95926;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', system-ui, sans-serif;
    padding-inline: 16px;
    padding-block: 20px 48px;
    font-size: 14px;
    line-height: 1.5;
  }
  h1, h2, h3 {
    font-family: 'Libre Franklin', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .num, td.num, .kpi-value, .kpi-sub {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ---------- 头部 ---------- */
  header.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    margin-bottom: 4px;
  }
  header.top h1 { font-size: 22px; margin: 0; }
  header.top .subtitle { color: var(--ink-soft); font-size: 13px; }
  .trend-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent);
  }
  .top-tools { margin-left: auto; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .view-picker { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
  .view-picker select {
    font-family: inherit; font-size: 12.5px; padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink); max-width: 240px;
  }
  .loader { margin: 48px auto; max-width: 520px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
  .loader.error { color: var(--crit); }
  .lang-toggle {
    display: inline-flex; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; background: var(--surface);
  }
  .lang-toggle button {
    appearance: none; border: none; background: transparent; color: var(--ink-soft);
    font-size: 12px; font-weight: 600; padding: 5px 11px; cursor: pointer;
  }
  .lang-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* ---------- KPI 卡片 ---------- */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin: 16px 0 12px;
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .kpi-label { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .kpi-value { font-size: 20px; font-weight: 600; }
  .kpi-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .kpi.crit .kpi-value { color: var(--crit); }
  .kpi.warn .kpi-value { color: var(--warn); }
  .kpi.good .kpi-value { color: var(--good); }

  .callout {
    border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin: 4px 0 12px;
    border: 1px solid var(--border);
  }
  .callout.note { background: var(--surface-2); color: var(--ink-soft); }
  .callout.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .callout ul { margin: 4px 0 0; padding-left: 18px; }

  /* ---------- Tabs ---------- */
  .tabbar {
    display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--border);
    margin: 8px 0 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg);
    z-index: 6; padding-top: 2px;
  }
  .tabbtn {
    appearance: none; border: none; background: transparent; color: var(--ink-soft);
    font-size: 13px; font-weight: 600; padding: 9px 14px;
    cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent;
  }
  .tabbtn:hover { color: var(--ink); }
  .tabbtn[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tabbtn .count {
    display: inline-block; margin-left: 5px; font-size: 10.5px; padding: 1px 5px;
    border-radius: 999px; background: var(--surface-2); color: var(--ink-soft);
  }
  .tabbtn[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

  /* ---------- 工具条 ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar input[type="search"], .toolbar select {
    font-family: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    min-width: 0; width: 200px; max-width: 100%;
  }
  .toolbar label.chk {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-soft);
    cursor: pointer; user-select: none;
  }
  .toolbar .hint { font-size: 11.5px; color: var(--ink-soft); margin-left: auto; }

  /* ---------- 表格 ---------- */
  /* 表头吸顶：父容器一旦 overflow-x:auto 就成了滚动容器，sticky 只相对它生效；
     所以给容器限高、让长表格在容器内纵向滚动，列头与左侧三列才能同时固定。
     短表格内容不足限高时不会出现内部滚动条。 */
  .tblwrap {
    overflow: auto; max-height: max(320px, calc(100vh - 150px));
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
  }
  @supports (height: 100dvh) { .tblwrap { max-height: max(320px, calc(100dvh - 150px)); } }
  table.data { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
  table.data th, table.data td {
    padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap;
    vertical-align: middle;
  }
  table.data td.wrap-name { white-space: normal; min-width: 150px; max-width: 220px; }
  table.data thead th {
    position: sticky; top: 0; background: var(--surface-2); color: var(--ink-soft);
    font-weight: 600; font-size: 11px; letter-spacing: .02em; z-index: 2;
  }
  table.data thead th.sortable { cursor: pointer; }
  table.data thead th.sorted { color: var(--accent); }
  table.data td.num, table.data th.num { text-align: right; }
  table.data tbody tr:hover > td { background: var(--accent-soft); }
  .sticky1, .sticky2, .sticky3 { position: sticky; background: var(--surface); z-index: 1; }
  thead .sticky1, thead .sticky2, thead .sticky3 { z-index: 3; background: var(--surface-2); }
  .sticky1 { left: 0; width: 48px; min-width: 48px; }
  .sticky2 { left: 48px; width: 96px; min-width: 96px; }
  .sticky3 { left: 144px; }

  /* ---------- 分页条 ---------- */
  .pager {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    margin: 8px 0 2px; font-size: 12px; color: var(--ink-soft);
  }
  .pager[hidden] { display: none; }
  .pager .pg-range { font-variant-numeric: tabular-nums; }
  .pager .pg-pages { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .pager .pg-pages button {
    min-width: 32px; height: 32px; padding: 0 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    font: inherit; font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .pager .pg-pages button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pager .pg-pages button[aria-current="page"] {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600;
  }
  .pager .pg-pages button:disabled { opacity: .4; cursor: default; }
  .pager .pg-pages button:focus-visible, .pager select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pager .pg-gap { padding: 0 2px; }
  .pager label { display: inline-flex; align-items: center; gap: 6px; }
  .pager select {
    font: inherit; padding: 5px 6px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }

  tr.expandable { cursor: pointer; }
  tr.expanded > td { background: var(--accent-soft); }
  tr.detail-row > td { background: var(--surface-2); padding: 0; }
  tr.detail-row:hover > td { background: var(--surface-2); }
  .detail-box {
    position: sticky; left: 0; width: min(920px, calc(100vw - 64px));
    padding: 10px 12px 14px;
  }
  .detail-box h4 { margin: 0 0 6px; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  table.mini { border-collapse: collapse; width: 100%; font-size: 12px; background: var(--surface); border-radius: 8px; overflow: hidden; }
  table.mini th, table.mini td { padding: 5px 9px; border-bottom: 1px solid var(--border); white-space: nowrap; text-align: left; }
  table.mini th { font-size: 10.5px; color: var(--ink-soft); font-weight: 600; background: var(--surface); }
  table.mini td.num, table.mini th.num { text-align: right; }
  table.mini tr:last-child td { border-bottom: none; }
  .sharebar {
    position: relative; display: inline-block; vertical-align: middle;
    width: 56px; height: 6px; border-radius: 3px; background: var(--border); margin-right: 6px;
  }
  .sharebar > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }

  .caret {
    display: inline-block; width: 10px; color: var(--accent); font-size: 10px;
    transition: transform .15s ease;
  }
  tr.expanded .caret { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .caret { transition: none; } }

  /* 货号点击复制 */
  .copy-item {
    appearance: none; border: none; background: none; cursor: copy;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 5px; margin: -2px -5px; border-radius: 5px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: var(--ink-soft);
  }
  .copy-item:hover { background: var(--accent-soft); color: var(--accent); }
  .copy-item svg { width: 12px; height: 12px; opacity: 0; transition: opacity .15s ease; }
  .copy-item:hover svg, .copy-item:focus-visible svg { opacity: 1; }
  @media (hover: none) { .copy-item svg { opacity: .55; } }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    z-index: 60; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px;
    font-size: 13px; box-shadow: var(--shadow); max-width: calc(100vw - 32px);
  }

  /* 手风琴：展开时高度从 0 过渡到内容高度（grid 行 0fr→1fr）；
     裁剪用 overflow: clip 而不是 hidden，hidden 会生成滚动容器，让明细框的横向吸附失效 */
  .acc { display: grid; grid-template-rows: 1fr; }
  .acc > .acc-inner { min-height: 0; overflow: clip; }
  tr.detail-row.opening .acc { animation: acc-open .26s cubic-bezier(.2, .7, .2, 1); }
  @keyframes acc-open { from { grid-template-rows: 0fr; opacity: 0; } to { grid-template-rows: 1fr; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { tr.detail-row.opening .acc { animation: none; } }

  .thumb-btn {
    appearance: none; border: none; background: none; padding: 0; margin: 0;
    display: block; border-radius: 6px; cursor: zoom-in;
  }
  .thumb {
    width: 34px; height: 34px; border-radius: 6px; object-fit: cover;
    background: var(--surface-2); border: 1px solid var(--border); display: block;
  }
  .thumb-btn:hover .thumb { border-color: var(--accent); }
  .itemnum { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: var(--ink-soft); }
  .pname { font-weight: 500; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  .badge.high { background: var(--good-bg); color: var(--good); }
  .badge.mid { background: var(--warn-bg); color: var(--warn); }
  .badge.low { background: var(--surface-2); color: var(--ink-soft); }
  .badge.urgent { background: var(--crit-bg); color: var(--crit); }
  .badge.flag { background: var(--accent-soft); color: var(--accent); }
  .badge.flag.stale { background: var(--warn-bg); color: var(--warn); }

  .chip {
    display: inline-block; font-size: 11px; padding: 1px 7px; margin: 1px 3px 1px 0;
    border-radius: 6px; background: var(--surface-2); color: var(--ink);
  }
  .chip b { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .chip.transfer { background: var(--accent-soft); color: var(--accent); }
  .chip.priority { background: var(--good-bg); color: var(--good); }
  .chip.short { background: var(--warn-bg); color: var(--warn); }
  .more { font-size: 11px; color: var(--accent); font-weight: 600; }
  .muted { color: var(--ink-soft); }

  .store-section { margin-bottom: 18px; }
  .store-section h3 { font-size: 14px; margin: 0 0 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  .store-section h3 .store-meta { font-size: 11.5px; color: var(--ink-soft); font-weight: 400; }

  .empty { padding: 30px; text-align: center; color: var(--ink-soft); font-size: 13px; }

  .notes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .notes-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .notes-card h3 { font-size: 13px; margin: 0 0 8px; }
  .notes-card p, .notes-card li { font-size: 12.5px; color: var(--ink-soft); }
  .notes-card ul { padding-left: 18px; margin: 0; }
  .notes-card table { width: 100%; font-size: 12px; border-collapse: collapse; }
  .notes-card table td { padding: 3px 0; border: none; vertical-align: top; }
  .notes-card table td:first-child { color: var(--ink-soft); width: 52%; padding-right: 8px; }

  footer.pagefoot { margin-top: 28px; font-size: 11.5px; color: var(--ink-soft); text-align: center; }

  /* ---------- 图片放大（灯箱）：固定深色遮罩，两种主题下都一致 ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 50; background: rgba(12,14,16,.84);
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .lb-figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; }
  .lb-figure img {
    display: block; width: min(92vw, 480px); height: auto; max-height: 74vh; object-fit: contain;
    background: #FFFFFF; border-radius: 10px; box-shadow: 0 12px 48px rgba(0,0,0,.45);
    transition: filter .2s ease;
  }
  .lb-figure img.is-loading { filter: blur(3px); }
  @media (prefers-reduced-motion: reduce) { .lb-figure img { transition: none; } }
  .lb-figure figcaption { color: #F2F0EA; font-size: 13.5px; text-align: center; max-width: 760px; }
  .lb-figure figcaption .lb-item { font-family: 'IBM Plex Mono', monospace; color: #C9C6BE; margin-right: 8px; }
  .lb-figure figcaption .lb-hint { display: block; margin-top: 4px; font-size: 11.5px; color: #A9A69E; }
  .lb-close {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px;
    width: 40px; height: 40px; border-radius: 999px; border: none;
    background: rgba(255,255,255,.16); color: #FFFFFF; font-size: 22px; line-height: 1; cursor: pointer;
  }
  .lb-close:focus-visible { outline: 2px solid #FFFFFF; }

  /* ---------- 进销累计页签 ---------- */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button {
    appearance: none; border: none; border-right: 1px solid var(--border); background: transparent;
    color: var(--ink-soft); font-size: 12px; font-weight: 600; padding: 6px 11px; cursor: pointer;
  }
  .seg button:last-child { border-right: none; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg button .n { font-family: 'IBM Plex Mono', monospace; font-weight: 500; margin-left: 5px; opacity: .8; }
  .st-summary { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12.5px; color: var(--ink-soft); margin: 0 0 8px; }
  .st-summary b { color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .ratecell { display: inline-flex; align-items: center; gap: 6px; }
  .ratebar { position: relative; display: inline-block; width: 56px; height: 6px; border-radius: 3px; background: var(--border); }
  .ratebar > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--series-sold); }
  .flag-over { font-size: 10.5px; font-weight: 600; color: var(--warn); }
  .st-detail { display: flex; flex-direction: column; gap: 10px; }
  .st-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .st-scope { font-size: 13px; font-weight: 600; color: var(--ink); }
  .st-back {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--accent);
    border-radius: 7px; font-size: 12px; font-weight: 600; padding: 3px 9px; cursor: pointer;
  }
  .st-kpis { font-size: 12px; color: var(--ink-soft); }
  .st-kpis b { color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .st-charts { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 900px) { .st-charts { grid-template-columns: 1fr 1fr; } }
  .st-chart { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px 6px; }
  .st-chart h5 { margin: 0 0 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
  .st-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 2px; }
  .st-legend i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 5px; }
  .st-svg svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .st-svg text { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; fill: var(--ink-soft); }
  .st-svg text.endlabel { font-size: 11px; fill: var(--ink); }
  .st-empty { font-size: 12px; color: var(--ink-soft); padding: 18px 0; text-align: center; }
  .st-tip {
    position: absolute; z-index: 4; pointer-events: none; white-space: nowrap;
    background: var(--ink); color: var(--bg); font-size: 11.5px; line-height: 1.5;
    padding: 6px 9px; border-radius: 6px; box-shadow: var(--shadow);
  }
  .st-tip b { font-family: 'IBM Plex Mono', monospace; }

          render();
          state.justOpened = null;
          // 上方的展开行收起后，点中的行可能被顶出可视区，滚回来贴住表头下沿
          var wrap = tableEl.closest(".tblwrap");
          var row = null;
          tbody.querySelectorAll("tr.expandable").forEach(function (x) { if (x.getAttribute("data-key") === k) row = x; });
          if (wrap && row) {
            var headH = tableEl.tHead ? tableEl.tHead.getBoundingClientRect().height : 0;
            var over = wrap.getBoundingClientRect().top + headH - row.getBoundingClientRect().top;
            if (over > 0) wrap.scrollTop -= over;
          }
        };
      }
      renderPager(all.length, pages, start, list.length);
      return all.length;
    }

    // 分页条：总数不超过最小每页行数（50）时整条隐藏
    function renderPager(total, pages, start, shown) {
      var l = L();
      pagerEl.hidden = total <= PAGE_SIZES[0];
      if (pagerEl.hidden) { pagerEl.innerHTML = ""; return; }
      var cur = state.page;
      var btns = '<button type="button" data-page="' + (cur - 1) + '" data-role="prev" aria-label="' + esc(l.pgPrev) + '"' + (cur === 0 ? " disabled" : "") + ">‹</button>";
      pageItems(cur, pages).forEach(function (p) {
        btns += p === null
          ? '<span class="pg-gap" aria-hidden="true">…</span>'
          : '<button type="button" data-page="' + p + '" aria-label="' + esc(l.pgPage(p + 1)) + '"' + (p === cur ? ' aria-current="page"' : "") + ">" + (p + 1) + "</button>";
      });
      btns += '<button type="button" data-page="' + (cur + 1) + '" data-role="next" aria-label="' + esc(l.pgNext) + '"' + (cur >= pages - 1 ? " disabled" : "") + ">›</button>";
      pagerEl.innerHTML =
        '<span class="pg-range">' + esc(l.pgRange(fmtNum(start + 1), fmtNum(start + shown), fmtNum(total))) + "</span>" +
        (pages > 1 ? '<nav class="pg-pages" aria-label="' + esc(l.pgSize) + '">' + btns + "</nav>" : "") +
        '<label>' + esc(l.pgSize) + ' <select aria-label="' + esc(l.pgSize) + '">' + PAGE_SIZES.map(function (n) {
          return '<option value="' + n + '"' + (n === PAGE_SIZE ? " selected" : "") + ">" + n + "</option>";
        }).join("") + "</select></label>";
    }

    function goPage(p, role) {
      state.page = p;
      render();
      // 换页后回到表格顶部；表格顶部已滚出屏幕时把它滚回可视区
      wrapEl.scrollTop = 0;
      if (wrapEl.getBoundingClientRect().top < 0) wrapEl.scrollIntoView({ block: "start" });
      // 分页条整块重画会丢焦点，键盘用户把焦点还给同一个按钮
      var again = pagerEl.querySelector(role ? '[data-role="' + role + '"]' : '[aria-current="page"]');
      if (again && !again.disabled) again.focus({ preventScroll: true });
      else { var cur = pagerEl.querySelector('[aria-current="page"]'); if (cur) cur.focus({ preventScroll: true }); }
    }
    pagerEl.addEventListener("click", function (ev) {
      var b = ev.target.closest("button[data-page]");
      if (!b || b.disabled) return;
      goPage(+b.getAttribute("data-page"), b.getAttribute("data-role"));
    });
    pagerEl.addEventListener("change", function (ev) {
      if (ev.target.tagName === "SELECT") setPageSize(+ev.target.value);
    });

    var handle = {
      el: tableEl,
      render: render,
      setQuery: function (q) { state.query = q; state.page = 0; return render(); },
      setFilter: function (fn) { state.filter = fn; state.page = 0; return render(); },
      count: function () { return state.lastCount; },
      // 每页行数变化时尽量保持当前看到的第一行仍在页内
      onPageSize: function () {
        state.page = Math.floor(state.page * state.pageSize / PAGE_SIZE);
        state.pageSize = PAGE_SIZE;
        render();
      }
    };
    liveTables.push(handle);
    return handle;
  }

  // ============================================================
  // 进销累计：起始日以来进货量 vs 累计已售。图表为手写 SVG：两张图量纲不同，
  // 不做双纵轴——日销量柱图只放有销售的日期；累计图用连续日期、同一单位同一纵轴。
  // ============================================================
  var ST = { rows: [], store_names: {}, since: null, cutoff: null, days: 0 };
  var stSelectedStore = {};   // product_code -> store_code；null 表示全链
  var stOpen = {};            // product_code -> {el, row}：已展开的明细，窗口变化时重画
  var stThreshold = null;     // 当前售出率筛选阈值；null = 全部

  function stDate(offset) {
    var p = ST.since.split("-");
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + offset));
    return String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
  }
  function stPct(rate) { return rate === null || rate === undefined ? "—" : Math.round(rate * 100) + "%"; }
  function stNiceStep(raw) {
    if (raw <= 1) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  }
  function stTicks(minV, maxV) {
    var step = stNiceStep(Math.max(maxV - minV, 1) / 4);
    var lo = Math.floor(minV / step) * step, hi = Math.ceil(maxV / step) * step;
    if (hi === lo) hi = lo + step;
    var out = [];
    for (var t = lo; t <= hi + 1e-9; t += step) out.push(Math.round(t * 1000) / 1000);
    return out;
  }
  // 柱子只圆数据端（4px），基线端保持方角
  function stBarPath(x, w, yVal, yBase) {
    var h = Math.abs(yBase - yVal);
    var r = Math.min(4, w / 2, h);
    if (h < 0.5) return "";
    if (yVal <= yBase) {
      return "M" + x + "," + yBase + "V" + (yVal + r) + "Q" + x + "," + yVal + " " + (x + r) + "," + yVal +
        "H" + (x + w - r) + "Q" + (x + w) + "," + yVal + " " + (x + w) + "," + (yVal + r) + "V" + yBase + "Z";
    }
    return "M" + x + "," + yBase + "V" + (yVal - r) + "Q" + x + "," + yVal + " " + (x + r) + "," + yVal +
      "H" + (x + w - r) + "Q" + (x + w) + "," + yVal + " " + (x + w) + "," + (yVal - r) + "V" + yBase + "Z";
  }
  // 提示框定位在图表卡片内：先放指针右侧，放不下改到左侧
  function stShowTip(tip, html, px, py) {
    tip.innerHTML = html;
    tip.hidden = false;
    var cw = tip.parentNode.clientWidth;
    var left = px + 14, top = Math.max(4, py - 10);
    if (left + tip.offsetWidth > cw - 4) left = Math.max(4, px - tip.offsetWidth - 14);
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  // 指针位置换算：x 为 viewBox 坐标；cx/cy 为相对图表卡片的像素坐标
  function stPointer(svg, ev, W) {
    var rect = svg.getBoundingClientRect();
    var card = svg.closest(".st-chart").getBoundingClientRect();
    return { x: (ev.clientX - rect.left) * (W / rect.width), cx: ev.clientX - card.left, cy: ev.clientY - card.top, scale: rect.width / W, left: rect.left - card.left };
  }

  function stDrawDaily(host, tip, sales, label) {
    var l = L().st;
    if (!sales.length) { host.innerHTML = '<div class="st-empty">' + esc(l.noSales) + "</div>"; return; }
    var W = Math.max(260, host.clientWidth), H = 150, ml = 34, mr = 8, mt = 8, mb = 22;
    var pw = W - ml - mr, ph = H - mt - mb;
    var vals = sales.map(function (s) { return s[1]; });
    var ticks = stTicks(Math.min(0, Math.min.apply(null, vals)), Math.max(0, Math.max.apply(null, vals)));
    var y0 = ticks[0], y1 = ticks[ticks.length - 1];
    function y(v) { return mt + ph - (v - y0) / (y1 - y0) * ph; }
    var n = sales.length, band = pw / n, bw = Math.max(2, Math.min(24, band - 2));
    var parts = [];
    ticks.forEach(function (t) {
      parts.push('<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--border)" stroke-width="1"/>');
      parts.push('<text x="' + (ml - 6) + '" y="' + (y(t) + 3) + '" text-anchor="end">' + fmtNum(t) + "</text>");
    });
    // 横轴只放有销售的日期；标签过密时隔几个显示一个
    var every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / 46))));
    sales.forEach(function (s, i) {
      var x = ml + band * i + (band - bw) / 2;
      parts.push('<path d="' + stBarPath(x, bw, y(s[1]), y(0)) + '" fill="var(--series-sold)"/>');
      if (i % every === 0) parts.push('<text x="' + (ml + band * (i + 0.5)) + '" y="' + (H - 6) + '" text-anchor="middle">' + stDate(s[0]) + "</text>");
      parts.push('<rect class="hit" data-i="' + i + '" x="' + (ml + band * i) + '" y="' + mt + '" width="' + band + '" height="' + ph + '" fill="transparent"/>');
    });
    host.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(l.aria(label)) + '">' + parts.join("") + "</svg>";
    var svg = host.querySelector("svg");
    svg.addEventListener("pointermove", function (ev) {
      var hit = ev.target.closest("rect.hit");
      if (!hit) { tip.hidden = true; return; }
      var s = sales[+hit.getAttribute("data-i")];
      var pt = stPointer(svg, ev, W);
      stShowTip(tip, stDate(s[0]) + '<br><i style="background:var(--series-sold)"></i>' + esc(l.daySold) + " <b>" + fmtNum(s[1]) + "</b>", pt.cx, pt.cy);
    });
    svg.addEventListener("pointerleave", function () { tip.hidden = true; });
  }

  function stDrawCumulative(host, tip, purchases, sales, label) {
    var l = L().st, days = Math.max(1, ST.days);
    var dp = {}, ds = {};
    purchases.forEach(function (p) { dp[p[0]] = (dp[p[0]] || 0) + p[1]; });
    sales.forEach(function (s) { ds[s[0]] = (ds[s[0]] || 0) + s[1]; });
    var cp = [], cs = [], a = 0, b = 0;
    for (var d = 0; d <= days; d++) { a += dp[d] || 0; b += ds[d] || 0; cp.push(a); cs.push(b); }
    var W = Math.max(260, host.clientWidth), H = 170, ml = 40, mr = 96, mt = 10, mb = 22;
    var pw = W - ml - mr, ph = H - mt - mb;
    var ticks = stTicks(Math.min(0, Math.min.apply(null, cs)), Math.max(1, cp[days], Math.max.apply(null, cs)));
    var y0 = ticks[0], y1 = ticks[ticks.length - 1];
    function x(dd) { return ml + dd / days * pw; }
    function y(v) { return mt + ph - (v - y0) / (y1 - y0) * ph; }
    // 阶梯线：当天的进货/销量在当天跳变
    function stepPath(c) {
      var path = "M" + x(0) + "," + y(c[0]);
      for (var i = 1; i <= days; i++) {
        if (c[i] !== c[i - 1]) path += "H" + x(i) + "V" + y(c[i]);
      }
      return path + "H" + x(days);
    }
    var parts = [];
    ticks.forEach(function (t) {
      parts.push('<line x1="' + ml + '" x2="' + (x(days)) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--border)" stroke-width="1"/>');
      parts.push('<text x="' + (ml - 6) + '" y="' + (y(t) + 3) + '" text-anchor="end">' + fmtNum(t) + "</text>");
    });
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var dd = Math.round(days * f);
      parts.push('<text x="' + x(dd) + '" y="' + (H - 6) + '" text-anchor="' + (f === 0 ? "start" : f === 1 ? "end" : "middle") + '">' + stDate(dd) + "</text>");
    });
    parts.push('<line class="xhair" x1="0" x2="0" y1="' + mt + '" y2="' + (mt + ph) + '" stroke="var(--ink-soft)" stroke-width="1" visibility="hidden"/>');
    parts.push('<path d="' + stepPath(cp) + '" fill="none" stroke="var(--series-purchased)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
    parts.push('<path d="' + stepPath(cs) + '" fill="none" stroke="var(--series-sold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
    // 每次进货在阶梯上打点（8px，带 2px 底色环）
    Object.keys(dp).forEach(function (k) {
      var dd = +k;
      if (dd < 0 || dd > days) return;
      parts.push('<circle cx="' + x(dd) + '" cy="' + y(cp[dd]) + '" r="4" fill="var(--series-purchased)" stroke="var(--surface)" stroke-width="2"/>');
    });
    // 末端直接标注；两条线太近时上下错开
    var ep = y(cp[days]), es = y(cs[days]);
    if (Math.abs(ep - es) < 13) { if (ep <= es) { ep -= 7; es += 7; } else { ep += 7; es -= 7; } }
    [[ep, "var(--series-purchased)", l.endPurchased + " " + fmtNum(cp[days])], [es, "var(--series-sold)", l.endSold + " " + fmtNum(cs[days])]].forEach(function (e) {
      parts.push('<line x1="' + (x(days) + 6) + '" x2="' + (x(days) + 16) + '" y1="' + e[0] + '" y2="' + e[0] + '" stroke="' + e[1] + '" stroke-width="2"/>');
      parts.push('<text class="endlabel" x="' + (x(days) + 20) + '" y="' + (e[0] + 4) + '">' + esc(e[2]) + "</text>");
    });
    parts.push('<rect class="hit" x="' + ml + '" y="' + mt + '" width="' + pw + '" height="' + ph + '" fill="transparent"/>');
    host.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(l.aria(label)) + '">' + parts.join("") + "</svg>";
    var svg = host.querySelector("svg"), xhair = svg.querySelector(".xhair");
    svg.addEventListener("pointermove", function (ev) {
      var pt = stPointer(svg, ev, W);
      if (pt.x < ml || pt.x > ml + pw) { tip.hidden = true; xhair.setAttribute("visibility", "hidden"); return; }
      var dd = Math.max(0, Math.min(days, Math.round((pt.x - ml) / pw * days)));
      xhair.setAttribute("x1", x(dd)); xhair.setAttribute("x2", x(dd)); xhair.setAttribute("visibility", "visible");
      var html = stDate(dd) +
        '<br><i style="background:var(--series-purchased)"></i>' + esc(l.cumPurchased) + " <b>" + fmtNum(cp[dd]) + "</b>" +
        '<br><i style="background:var(--series-sold)"></i>' + esc(l.cumSold) + " <b>" + fmtNum(cs[dd]) + "</b>" +
        (cp[dd] > 0 ? "<br>" + esc(l.dayRate) + " <b>" + stPct(cs[dd] / cp[dd]) + "</b>" : "") +
        (dp[dd] ? "<br>" + esc(l.dayPurchase) + " <b>+" + fmtNum(dp[dd]) + "</b>" : "") +
        (ds[dd] ? "<br>" + esc(l.daySold) + " <b>" + fmtNum(ds[dd]) + "</b>" : "");
      stShowTip(tip, html, pt.left + x(dd) * pt.scale, pt.cy);
    });
    svg.addEventListener("pointerleave", function () { tip.hidden = true; xhair.setAttribute("visibility", "hidden"); });
  }

  function stRateCell(rate) {
    if (rate === null || rate === undefined) return '<span class="muted">—</span>';
    var w = Math.max(0, Math.min(100, Math.round(rate * 100)));
    return '<span class="ratecell"><span class="ratebar"><span style="width:' + w + '%"></span></span><span class="num">' + stPct(rate) + "</span>" +
      (rate > 1 ? '<span class="flag-over" title="' + esc(L().st.overTip) + '">' + esc(L().st.over) + "</span>" : "") + "</span>";
  }

  function stRenderDetail(el, r) {
    var l = L().st, c = L().col;
    var sel = stSelectedStore[r.product_code] || null;
    var scope = null;
    (r.stores || []).forEach(function (s) { if (s.store_code === sel) scope = s; });
    if (!scope) sel = null;
    var src = scope || r;
    var viewName = META.scope && META.scope.kind === "store" ? META.scope.store_name + " " + META.scope.store_code : l.chain;
    var scopeName = scope ? (ST.store_names[sel] || sel) + " " + sel : viewName;
    el.innerHTML = '<div class="st-detail">' +
      '<div class="st-head"><span class="st-scope">' + esc(l.scope(scopeName)) + "</span>" +
      (scope ? '<button type="button" class="st-back">' + esc(l.backToChain) + "</button>" : "") +
      '<span class="st-kpis">' + l.kpis(fmtNum(src.purchased), fmtNum(src.sold), stPct(src.rate)) + "</span></div>" +
      '<div class="st-charts">' +
      '<div class="st-chart"><h5>' + esc(l.dailyTitle) + '</h5><div class="st-svg" data-chart="daily"></div><div class="st-tip" hidden></div></div>' +
      '<div class="st-chart"><h5>' + esc(l.cumTitle) + '</h5><div class="st-legend">' +
      '<span><i style="background:var(--series-purchased)"></i>' + esc(l.cumPurchased) + "</span>" +
      '<span><i style="background:var(--series-sold)"></i>' + esc(l.cumSold) + "</span></div>" +
      '<div class="st-svg" data-chart="cum"></div><div class="st-tip" hidden></div></div>' +
      "</div>" +
      "<h4>" + esc(isStoreView() ? l.storesTitleStore : l.storesTitle((r.stores || []).length)) + "</h4>" +
      '<div style="overflow-x:auto"><table class="mini st-stores"><thead><tr><th>' + esc(c.store) + '</th><th class="num">' + esc(l.purchased) +
      '</th><th class="num">' + esc(l.sold) + "</th><th>" + esc(l.rate) + '</th><th class="num">' + esc(l.avgPurchase) + '</th><th class="num">' + esc(l.avgSale) +
      "</th><th>" + esc(l.lastPurchase) + "</th><th>" + esc(l.lastSale) +
      "</th></tr></thead><tbody>" +
      (r.stores || []).map(function (s) {
        return '<tr data-store="' + esc(s.store_code) + '" tabindex="0"' + (s.store_code === sel ? ' class="selected" aria-current="true"' : "") + ">" +
          "<td>" + esc(ST.store_names[s.store_code] || s.store_code) + ' <span class="itemnum">' + esc(s.store_code) + "</span></td>" +
          '<td class="num">' + fmtNum(s.purchased) + '</td><td class="num">' + fmtNum(s.sold) + "</td><td>" + stRateCell(s.rate) + "</td>" +
          '<td class="num">' + fmtMoney(s.avg_purchase_price) + '</td><td class="num">' + fmtMoney(s.avg_sale_price) + "</td>" +
          "<td>" + esc(s.last_purchase || "—") + "</td><td>" + esc(s.last_sale || "—") + "</td></tr>";
      }).join("") + "</tbody></table></div></div>";
    var tips = el.querySelectorAll(".st-tip");
    var label = (r.name || "") + " · " + scopeName;
    stDrawDaily(el.querySelector('[data-chart="daily"]'), tips[0], src.sales || [], label);
    stDrawCumulative(el.querySelector('[data-chart="cum"]'), tips[1], src.purchases || [], src.sales || [], label);
    el.querySelectorAll("tr[data-store]").forEach(function (tr) {
      function pick() {
        var code = tr.getAttribute("data-store");
        stSelectedStore[r.product_code] = stSelectedStore[r.product_code] === code ? null : code;
        stRenderDetail(el, r);
      }
      tr.addEventListener("click", pick);
      tr.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    });
    var back = el.querySelector(".st-back");
    if (back) back.addEventListener("click", function () { stSelectedStore[r.product_code] = null; stRenderDetail(el, r); });
  }

  function renderSellThrough() {
    var l = L().st;
    var panel = document.getElementById("panel-sell_through");
    stOpen = {};
    if (!ST.rows.length) { panel.innerHTML = '<div class="empty">' + esc(l.empty) + "</div>"; return; }
    var thresholds = [null, 0.9, 0.6, 0.3];
    function countAt(t) { return t === null ? ST.rows.length : ST.rows.filter(function (r) { return r.rate >= t; }).length; }
    var overall = ST.total_purchased > 0 ? ST.total_sold / ST.total_purchased : null;
    panel.innerHTML =
      '<div class="st-summary">' + l.summary(esc(ST.since), esc(ST.cutoff), ST.days + 1, fmtNum(ST.total_purchased), fmtNum(ST.total_sold), stPct(overall), ST.rows.length) + "</div>" +
      '<div class="callout note">' + esc(l.caveat(fmtNum(ST.unmatched_qty))) + "</div>" +
      '<div class="toolbar"><input type="search" id="st-search" placeholder="' + esc(L().search) + '" aria-label="' + esc(L().search) + '">' +
      '<div class="seg" role="group" aria-label="' + esc(l.filterLabel) + '">' +
      thresholds.map(function (t) {
        return '<button type="button" data-t="' + (t === null ? "" : t) + '" aria-pressed="' + String(t === stThreshold) + '">' +
          (t === null ? esc(l.all) : "≥" + Math.round(t * 100) + "%") + '<span class="n">' + countAt(t) + "</span></button>";
      }).join("") + "</div>" +
      '<span class="hint">' + esc(l.hint) + "</span></div>" +
      '<div class="tblwrap"><table class="data"><thead></thead><tbody></tbody></table></div>';
    var columns = productColumns([
      { key: "purchased", label: l.purchased, numeric: true, render: function (r) { return fmtNum(r.purchased); } },
      { key: "sold", label: l.sold, numeric: true, render: function (r) { return fmtNum(r.sold); } },
      { key: "rate", label: l.rate, render: function (r) { return stRateCell(r.rate); } },
      { key: "avg_purchase_price", label: l.avgPurchase, numeric: true, render: function (r) { return fmtMoney(r.avg_purchase_price); } },
      { key: "avg_sale_price", label: l.avgSale, numeric: true, render: function (r) { return fmtMoney(r.avg_sale_price); } },
      { key: "first_purchase", label: l.firstPurchase, render: function (r) { return esc(r.first_purchase || "—"); } },
      { key: "last_purchase", label: l.lastPurchase, render: function (r) { return esc(r.last_purchase || "—"); } },
      { key: "last_sale", label: l.lastSale, render: function (r) { return esc(r.last_sale || "—"); } },
      { key: "store_count", label: l.stores, render: function (r) { return '<span class="more"><span class="caret">▶</span> ' + esc(L().storesCell(r.store_count)) + "</span>"; } }
    ]);
    var t = buildTable(panel.querySelector("table"), columns, ST.rows, {
      defaultSortKey: "sold",
      expand: function () { return '<div class="detail-box"></div>'; },
      afterExpand: function (r, box) { stOpen[r.product_code] = { el: box, row: r }; stRenderDetail(box, r); }
    });
    t.setFilter(stThreshold === null ? null : function (r) { return r.rate >= stThreshold; });
    document.getElementById("st-search").addEventListener("input", function (e) { t.setQuery(e.target.value); });
    panel.querySelectorAll(".seg button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var v = btn.getAttribute("data-t");
        stThreshold = v === "" ? null : +v;
        panel.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
        t.setFilter(stThreshold === null ? null : function (r) { return r.rate >= stThreshold; });
      });
    });
  }

  // 窗口尺寸变化时重画已展开明细里的图（图宽按容器实际像素绘制，保证文字清晰）
  var stResizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(stResizeTimer);
    stResizeTimer = setTimeout(function () {
      Object.keys(stOpen).forEach(function (k) {
        var o = stOpen[k];
        if (document.body.contains(o.el)) stRenderDetail(o.el, o.row); else delete stOpen[k];
      });
    }, 150);
  });

  // ============================================================
  // 页签
  // ============================================================
  var TAB_IDS = ["bestsellers", "sell_through", "high_value", "forecast", "store_gaps", "no_purchase", "notes"];
  var activeTab = "bestsellers";
  try {
    var savedTab = window.localStorage.getItem("ub-restock-tab");
    if (TAB_IDS.indexOf(savedTab) >= 0) activeTab = savedTab;
  } catch (e) { /* 忽略 */ }

  function tabCount(id) {
    if (id === "bestsellers") return DATA.bestsellers.length;
    if (id === "sell_through") return ST.rows.length;
    if (id === "high_value") return DATA.high_value.length;
    if (id === "forecast") return DATA.forecast.length;
    if (id === "store_gaps") return DATA.store_gaps.reduce(function (s, g) { return s + g.rows.length; }, 0);
    if (id === "no_purchase") return DATA.no_purchase.reduce(function (s, g) { return s + g.rows.length; }, 0);
    return null;
  }

  var PANEL_RENDERERS = {
    bestsellers: renderBestsellers, sell_through: renderSellThrough, high_value: renderHighValue,
    forecast: renderForecast, store_gaps: renderStoreGaps, no_purchase: renderNoPurchase, notes: renderNotes
  };
  var renderedPanels = {};

  function showTab(id) {
    activeTab = id;
    if (!renderedPanels[id]) { renderedPanels[id] = true; PANEL_RENDERERS[id](); }
    try { window.localStorage.setItem("ub-restock-tab", id); } catch (e) { /* 忽略 */ }
    document.querySelectorAll(".tabbtn").forEach(function (b) {
      b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === id));
    });
    TAB_IDS.forEach(function (t) { document.getElementById("panel-" + t).hidden = t !== id; });
  }

  function renderTabs() {
    var bar = document.getElementById("tabbar");
    bar.innerHTML = TAB_IDS.map(function (id) {
      var n = tabCount(id);
      return '<button type="button" role="tab" class="tabbtn" data-tab="' + id + '" aria-controls="panel-' + id + '">' +
        esc(L().tabs[id]) + (n !== null ? '<span class="count">' + n + "</span>" : "") + "</button>";
    }).join("");
    bar.querySelectorAll(".tabbtn").forEach(function (b) {
      b.addEventListener("click", function () { showTab(b.getAttribute("data-tab")); });

  // ============================================================
  // 图片放大（灯箱）
  // ============================================================
  var lb = document.getElementById("lightbox");
  var lbImg = document.getElementById("lb-img");
  var lbCap = document.getElementById("lb-cap");
  var lbClose = document.getElementById("lb-close");
  var lastOpener = null;
  var currentKey = null;
  var largeLoaded = {};

  // 预加载放大图；失败时续期登录再试一次
  function loadLarge(key) {
    function attempt(url) {
      return new Promise(function (resolve) {
        var im = new Image();
        im.onload = function () { resolve(url); };
        im.onerror = function () { resolve(null); };
        im.src = url;
      });
    }
    return attempt(largeUrl(key)).then(function (url) {
      if (url) return url;
      return refreshSession().then(function (ok) { return ok ? attempt(withRetryToken(largeUrl(key))) : null; });
    });
  }
  function setCaption(item, name, hint) {
    lbCap.innerHTML = '<span class="lb-item">' + esc(item) + "</span>" + esc(name) +
      '<span class="lb-hint">' + esc(hint) + "</span>";
  }

  function openLightbox(btn) {
    lastOpener = btn;
    var key = btn.getAttribute("data-img");
    var item = btn.getAttribute("data-item");
    var name = btn.getAttribute("data-name");
    currentKey = key;
    var large = largeLoaded[key];
    // 先用已加载的缩略图占位（模糊），大图下载完再替换
    lbImg.src = large || thumbUrl(key);
    lbImg.alt = name || "";
    lbImg.classList.toggle("is-loading", !large);
    setCaption(item, name, large ? L().zoomHint : L().zoomLoading);
    lbClose.setAttribute("aria-label", LANG === "zh" ? "关闭" : "Close");
    lb.hidden = false;
    document.body.style.overflow = "hidden";
    lbClose.focus();
    if (!large) {
      loadLarge(key).then(function (big) {
        if (big) largeLoaded[key] = big;
        if (currentKey !== key) return;
        if (big) lbImg.src = big;
        lbImg.classList.remove("is-loading");
        setCaption(item, name, big ? L().zoomHint : L().zoomUnavailable);
      });
    }
  }
  function closeLightbox() {
    if (lb.hidden) return;
    lb.hidden = true;
    currentKey = null;
    lbImg.removeAttribute("src");
    lbImg.classList.remove("is-loading");
    document.body.style.overflow = "";
    if (lastOpener && document.body.contains(lastOpener)) lastOpener.focus();
    lastOpener = null;
  }

  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest(".thumb-btn");
    if (btn) {
      ev.preventDefault();
      ev.stopPropagation();
      openLightbox(btn);
    }
  }, true);
  lb.addEventListener("click", function (ev) {
    if (ev.target === lb || ev.target === lbClose || ev.target.closest(".lb-figure") === null) closeLightbox();
  });
  lbClose.addEventListener("click", closeLightbox);
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeLightbox();
  });

  // ============================================================
  // 数据加载：先问后端能看哪些门店，再按需加载对应的数据文件（每个文件由 nginx 单独鉴权）
  // ============================================================
  var REPORT_ROOT = "/reports/kfc-uncle-bills/";
  var SCOPE = null;          // { allStores, storeCodes }
  var viewCache = {};
  var currentViewId = null;

  function viewOptions() {
    var byCode = {}, opts = [];
    (BOOT.stores || []).forEach(function (s) { byCode[s.store_code] = s; });
    if (SCOPE.allStores) {
      opts.push({ id: "all", label: L().viewAll });
      (BOOT.stores || []).forEach(function (s) { opts.push({ id: "store-" + s.store_code, label: s.store_name + " " + s.store_code }); });
    } else {
      (SCOPE.storeCodes || []).forEach(function (code) {
        if (byCode[code]) opts.push({ id: "store-" + code, label: byCode[code].store_name + " " + code });
      });
    }
    return opts;
  }
  function renderViewPicker() {
    var sel = document.getElementById("view-select");
    var opts = SCOPE ? viewOptions() : [];
    document.getElementById("view-label").textContent = L().viewLabel;
    sel.innerHTML = opts.map(function (o) {
      return '<option value="' + esc(o.id) + '"' + (o.id === currentViewId ? " selected" : "") + ">" + esc(o.label) + "</option>";
    }).join("");
    sel.disabled = opts.length <= 1;
    sel.parentNode.hidden = !opts.length;
  }
  function showLoader(msg, isError) {
    var el = document.getElementById("loader");
    el.hidden = false;
    el.textContent = msg;
    el.classList.toggle("error", !!isError);
  }
  function goGate() {
    window.location.replace("/reports/_gate/?to=" + encodeURIComponent(REPORT_ROOT));
    var gone = new Error("unauthorized"); gone.status = 401; throw gone;
  }
  // 登录令牌 15 分钟过期。接口直接返回 401；报告数据文件则由 nginx 302 到续期中转页，
  // 所以不跟随跳转（redirect: manual），把跳转也当作过期。过期时先静默续期再重试一次，
  // 续期失败才整页转去中转页（中转页会再试续期，失败才去登录）。
  function fetchJson(url, retried) {
    return fetch(url, { credentials: "include", cache: "no-cache", redirect: "manual", headers: { Accept: "application/json" } }).then(function (res) {
      var expired = res.status === 401 || res.type === "opaqueredirect" ||
        (res.redirected && res.url.indexOf("/reports/_gate/") >= 0);
      if (expired) {
        if (retried) return goGate();
        return refreshSession().then(function (ok) { return ok ? fetchJson(url, true) : goGate(); });
      }
      if (!res.ok) { var err = new Error("HTTP " + res.status); err.status = res.status; throw err; }
      return res.json();
    });
  }
  function loadScope() {
    return fetchJson("/api/react/v1/static-report-access/kfc-uncle-bills/scope").then(function (j) {
      return (j && j.data) || { allStores: false, storeCodes: [] };
    }, function (err) {
      // 过渡期旧后端没有范围接口（404）：旧后端只放行能看全部门店的角色，按全部门店处理
      if (err.status === 404) return { allStores: true, storeCodes: [] };
      throw err;
    });
  }
  function loadView(id) {
    if (viewCache[id]) return Promise.resolve(viewCache[id]);
    return fetchJson("data/" + id + ".json").then(function (d) { viewCache[id] = d; return d; });
  }
  function applyView(id, data) {
    currentViewId = id;
    try { window.localStorage.setItem("ub-restock-view", id); } catch (e) { /* 忽略 */ }
    DATA = data;
    META = data.meta;
    ST = DATA.sell_through || { rows: [], store_names: {}, since: null, cutoff: null, days: 0 };
    stSelectedStore = {};
    stOpen = {};
    document.getElementById("loader").hidden = true;
    document.getElementById("report-body").hidden = false;
    renderAll();
  }
  function explainError(err) {
    if (err && err.status === 401) return;
    showLoader(err && err.status === 403 ? L().noStoreAccess : L().loadFailed, true);
  }
  document.getElementById("view-select").addEventListener("change", function (e) {
    var id = e.target.value;
    showLoader(L().loading, false);
    loadView(id).then(function (d) { applyView(id, d); }, function (err) {
      document.getElementById("report-body").hidden = true;
      explainError(err);
    });
  });

  renderHeader();
  showLoader(L().loading, false);
  loadScope().then(function (scope) {
    SCOPE = scope;
    var opts = viewOptions();
    if (!opts.length) { renderViewPicker(); showLoader(L().noScopeStores, true); return null; }
    var saved = null;
    try { saved = window.localStorage.getItem("ub-restock-view"); } catch (e) { /* 忽略 */ }
    var first = opts.some(function (o) { return o.id === saved; }) ? saved : opts[0].id;
    return loadView(first).then(function (d) { applyView(first, d); });
  }).catch(explainError);
})();
</script>
