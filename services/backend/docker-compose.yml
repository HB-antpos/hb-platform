services:
  hb-api:
    build: &hb-api-build
      context: .
      dockerfile: BlazorApp.Api/Dockerfile
    image: &hb-api-image blazorapphbweb_hb-api_vite:local
    container_name: hb-platform-vite-api
    ports:
      - "5002:5002"
    environment: &hb-api-environment
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5002
      - ASPNETCORE_HTTP_PORTS=5002
      # 主 API 单实例部署保持调度身份稳定，避免更换容器后等待旧实例 60 分钟失效。
      - ScheduledTasks__InstanceId=hbweb-vite-production
      # 折扣快照按业务日期滚动回填最近一年，保留更早的已有数据。
      - ScheduledTasks__DiscountSnapshotHistoricalYears=1
      # 完成供应商历史回填并核对版本后再开启，关闭即可切回既有统计读取路径。
      - Reports__UseSupplierRollups=${REPORTS_USE_SUPPLIER_ROLLUPS:-false}
      # 日统计直写国内供应商编码：读取侧与写入侧都上线、且季度任务跑完后再开启。
      # 关闭后新重算的日期写回 200；已经直写的日期不用处理，读取侧两种行都认。
      - SalesStatistics__WriteDirectChinaSupplierCode=${SALES_STATISTICS_WRITE_DIRECT_CHINA_SUPPLIER_CODE:-false}
      # 生产连接字符串只从服务器 .env 注入，避免把敏感值写入 compose。
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING_DEFAULT}
      - ConnectionStrings__StoreHzgHQConnection=${CONNECTION_STRING_STORE_HQ}
      - ConnectionStrings__HBSalesConnection=${CONNECTION_STRING_SALES}
      - ConnectionStrings__PostgresConnection=${CONNECTION_STRING_POSTGRES}
      - ConnectionStrings__HBPOSMConnection=${CONNECTION_STRING_POSM}
      - ConnectionStrings__HBSalesRecord=${CONNECTION_STRING_SALES_RECORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-BlazorApp}
      - Jwt__Audience=${JWT_AUDIENCE:-BlazorAppUsers}
      - Jwt__ExpireMinutes=${JWT_EXPIRE_MINUTES:-480}
      - Cookie__Secure=${COOKIE_SECURE:-true}
      - Cookie__SameSite=${COOKIE_SAMESITE:-Lax}
      # 正式 Unlisted App Store 链接提供安全默认值，服务器仍可通过 .env 覆盖为其他 HTTPS 地址。
      - BrowserExtension__SafariStoreUrl=${BROWSER_EXTENSION_SAFARI_STORE_URL:-https://apps.apple.com/au/app/hb-supplier-order/id6803740010}
      # WPF 更新检查密钥只从服务器 .env 注入，禁止写入仓库。
      - WpfAppUpdate__CheckApiKey=${WPF_APP_UPDATE_CHECK_API_KEY:?required}
      # 远程维护仅在迁移、安装包校验与客户端验收准备好后启用；秘密只从服务器注入。
      - RemoteMaintenance__Enabled=${REMOTE_MAINTENANCE_ENABLED:-false}
      - RemoteMaintenance__IdServer=hotbargain.vip:21116
      - RemoteMaintenance__RelayServer=hotbargain.vip:21117
      - RemoteMaintenance__PublicKey=${REMOTE_MAINTENANCE_PUBLIC_KEY:-}
      - RemoteMaintenance__InterApiKey=${REMOTE_MAINTENANCE_INTER_API_KEY:-}
      - RemoteMaintenance__HeartbeatBaseUrl=https://hotbargain.vip
      - RemoteMaintenance__OnlineThresholdSeconds=60
      - RemoteMaintenance__HeartbeatMinIntervalSeconds=10
      - RemoteMaintenance__ArtifactRootPath=/app/App_Data/RemoteMaintenance/artifacts
      - RemoteMaintenance__RustdeskArtifact__Version=${REMOTE_MAINTENANCE_RUSTDESK_VERSION:-}
      - RemoteMaintenance__RustdeskArtifact__FileName=${REMOTE_MAINTENANCE_RUSTDESK_FILE:-}
      - RemoteMaintenance__RustdeskArtifact__Path=${REMOTE_MAINTENANCE_RUSTDESK_FILE:-}
      - RemoteMaintenance__RustdeskArtifact__Sha256=${REMOTE_MAINTENANCE_RUSTDESK_SHA256:-}
      - RemoteMaintenance__RustdeskArtifact__SizeBytes=${REMOTE_MAINTENANCE_RUSTDESK_SIZE:-0}
      - RemoteMaintenance__StatusAgentArtifact__Version=${REMOTE_MAINTENANCE_AGENT_VERSION:-}
      - RemoteMaintenance__StatusAgentArtifact__FileName=${REMOTE_MAINTENANCE_AGENT_FILE:-}
      - RemoteMaintenance__StatusAgentArtifact__Path=${REMOTE_MAINTENANCE_AGENT_FILE:-}
      - RemoteMaintenance__StatusAgentArtifact__Sha256=${REMOTE_MAINTENANCE_AGENT_SHA256:-}
      - RemoteMaintenance__StatusAgentArtifact__SizeBytes=${REMOTE_MAINTENANCE_AGENT_SIZE:-0}
      # 中心日志状态与保留策略显式写入生产 compose，外部项目摘要只从 .env 注入。
      - ApplicationLogging__Enabled=true
      - ApplicationLogging__DefaultProjectCode=HBBBackend
      - ApplicationLogging__DefaultEnvironment=Production
      - ApplicationLogging__DefaultSourceType=Backend
      - ApplicationLogging__ServiceName=HBBBackend.Api
      - ApplicationLogging__MinimumLevel=Warning
      - ApplicationLogging__DefaultRetentionDays=7
      - ApplicationLogging__Projects__0__ProjectCode=HBBBackend
      - ApplicationLogging__Projects__0__DisplayName=Web/移动端后端
      - ApplicationLogging__Projects__0__Enabled=true
      - ApplicationLogging__Projects__0__RetentionDays=7
      - ApplicationLogging__Projects__1__ProjectCode=hbweb_rv
      - ApplicationLogging__Projects__1__DisplayName=Web前端
      - ApplicationLogging__Projects__1__Enabled=true
      - ApplicationLogging__Projects__1__RetentionDays=7
      - ApplicationLogging__Projects__1__ApiKeyHash=${CENTER_LOG_HBWEB_RV_KEY_SHA256:?required}
      - ApplicationLogging__Projects__2__ProjectCode=HbwebExpo
      - ApplicationLogging__Projects__2__DisplayName=移动端
      - ApplicationLogging__Projects__2__Enabled=false
      - ApplicationLogging__Projects__2__RetentionDays=7
      - ApplicationLogging__Projects__3__ProjectCode=hbpos_win
      - ApplicationLogging__Projects__3__DisplayName=WPF客户端
      - ApplicationLogging__Projects__3__Enabled=false
      - ApplicationLogging__Projects__3__RetentionDays=30
      - ApplicationLogging__Projects__4__ProjectCode=hbpos_api
      - ApplicationLogging__Projects__4__DisplayName=WPF收银后端
      - ApplicationLogging__Projects__4__Enabled=true
      - ApplicationLogging__Projects__4__RetentionDays=7
      - ApplicationLogging__Projects__4__ApiKeyHash=${CENTER_LOG_HBPOS_API_KEY_SHA256:?required}
      - ApplicationLogging__Projects__5__ProjectCode=hbpos_ipad
      - ApplicationLogging__Projects__5__DisplayName=iPad客户端
      - ApplicationLogging__Projects__5__Enabled=true
      - ApplicationLogging__Projects__5__RetentionDays=30
      - ApplicationLogging__Projects__5__ApiKeyHash=${CENTER_LOG_HBPOS_IPAD_KEY_SHA256:?required}
      # SMTP 密码密文依赖 DataProtection key ring，必须落到宿主机目录以跨容器重建保留。
      - DataProtection__KeysPath=/app/App_Data/DataProtectionKeys
      # 考勤二维码使用独立 key ring，仅向需要互通的考勤服务共享。
      - AttendanceQrDataProtection__KeysPath=/app/App_Data/AttendanceQrDataProtectionKeys
      # Linkly 多终端密码与配对 Secret 使用独立 ring，Admin 与 POS API 必须挂载同一受控目录。
      - LinklyCloudCredentialDataProtection__KeysPath=/app/App_Data/LinklyCloudCredentialDataProtectionKeys
      # EAS webhook secret 只从服务器 .env 注入；profile 白名单固定允许生产与预览构建回写。
      - EasWebhook__Secret=${EAS_WEBHOOK_SECRET}
      - EasWebhook__AllowedAccountName=${EAS_WEBHOOK_ALLOWED_ACCOUNT_NAME}
      - EasWebhook__AllowedProjectName=${EAS_WEBHOOK_ALLOWED_PROJECT_NAME}
      # 匿名 Mobile APK 自动更新总闸；生产异常时在服务器 .env 置 false 后仅重建 API 即可止损。
      - MobileAppBuilds__PublicAndroidUpdatesEnabled=${MOBILE_APP_BUILDS_PUBLIC_ANDROID_UPDATES_ENABLED:-true}
      # 旧移动端与独立手持端按 EAS project 显式映射到不同 AppKey，避免构建记录串包。
      - EasWebhook__ProjectAppKeys__hbweb-expo=mobile
      - EasWebhook__ProjectAppKeys__hb-pos-handheld=pos-handheld
      # 手持端策略候选必须绑定独立 EAS 项目和固定 OTA channel；不在此开启旧配置式全局策略。
      - PosHandheldUpdatePolicy__EasProjectName=hb-pos-handheld
      - PosHandheldUpdatePolicy__AndroidPackageName=com.hbweb.poshandheld
      - PosHandheldUpdatePolicy__AndroidSigningCertificateSha256=${POS_HANDHELD_ANDROID_SIGNING_CERTIFICATE_SHA256:?required}
      - PosHandheldUpdatePolicy__OtaChannel=pos-handheld-production
      # 手持端按 release channel 发布 OTA 的服务端放行闸门；默认关闭，由服务器 .env 显式开启。
      - EasWebhook__PosHandheldReleaseChannelPublishingEnabled=${EAS_WEBHOOK_POS_HANDHELD_RELEASE_CHANNEL_PUBLISHING_ENABLED:-false}
      - EasWebhook__AcceptedProfiles__0=preview
      - EasWebhook__AcceptedProfiles__1=production
      - Translation__Provider=deepseek
      # 生产翻译密钥只从服务器 .env 注入，避免在 compose 中写入明文或占位值。
      - Translation__DeepSeek__ApiKey=${DEEPSEEK_API_KEY}
      - TencentCloud__SecretId=${TENCENT_SECRET_ID}
      - TencentCloud__SecretKey=${TENCENT_SECRET_KEY}
      - TencentCloud__BucketName=${TENCENT_BUCKET_NAME}
      - TencentCloud__Region=${TENCENT_REGION}
      - TencentCloud__ImageBucketName=${TENCENT_IMAGE_BUCKET_NAME}
      - TencentCloud__ImageRegion=${TENCENT_IMAGE_REGION}
    volumes: &hb-api-volumes
      - hb-api-logs:/app/logs
      - ./data-protection-keys:/app/App_Data/DataProtectionKeys
      - /www/HBWeb/remote-maintenance/artifacts:/app/App_Data/RemoteMaintenance/artifacts:ro
      - ${ATTENDANCE_QR_DATA_PROTECTION_KEYS_HOST_PATH:?required}:/app/App_Data/AttendanceQrDataProtectionKeys
      - ${LINKLY_CLOUD_CREDENTIAL_DATA_PROTECTION_KEYS_HOST_PATH:?required}:/app/App_Data/LinklyCloudCredentialDataProtectionKeys
    restart: unless-stopped
    networks: &hb-api-networks
      - hb-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 仅在显式启用 schema profile 时运行；默认 docker compose up 不会启动迁移任务。
  hb-api-migrate:
    profiles: ["schema"]
    build: *hb-api-build
    image: *hb-api-image
    command: ["--schema=migrate"]
    environment: *hb-api-environment
    volumes: *hb-api-volumes
    restart: "no"
    networks: *hb-api-networks
    # 镜像自带 API 健康检查；一次性迁移任务不监听 HTTP，必须显式禁用。
    healthcheck:
      disable: true

networks:
  hb-network:
    driver: bridge
    name: hb-network

volumes:
  hb-api-logs:
    driver: local
