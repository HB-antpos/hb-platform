# 宿主机 Nginx（宝塔面板）上通知实时通道 /api/hubs/ 的反向代理片段。
#
# 为什么需要：后端的通知实时通道是 SignalR（路径 /api/hubs/notifications），优先走 WebSocket。
# 宿主机 location / 只做普通 HTTP 转发、不透传 Upgrade 头时，WebSocket 握手失败，SignalR 会自动
# 退回长轮询——功能仍可用，但每条通知多一次往返、服务器多维持一批挂起请求。加上本片段后走 WebSocket。
#
# 使用方式：把本文件内容放进 server { } 块（443），且放在 location / 之前；proxy_pass 的端口与该站点
# location / 指向的上游保持一致（web 容器宿主机端口，示例为 8080）。然后：
#   sudo nginx -t && sudo systemctl reload nginx
# 部署后验证（路由已到达后端时，不带令牌的 negotiate 请求返回 401）：
#   curl -sS -o /dev/null -w '%{http_code}\n' -X POST "https://<站点域名>/api/hubs/notifications/negotiate?negotiateVersion=1"
#   期望 401（未带令牌）；404 = 路由没到后端；502/504 = 上游端口不对。
#
# 约束（改动这段配置前请先对照）：
#   1. 只对 /api/hubs/ 透传升级头，其余 /api/ 保持原样。这里固定发 Connection "upgrade"，不依赖 http 块里的 map；
#      SignalR 的 negotiate / 长轮询请求带上它也无副作用。
#   2. proxy_read_timeout 必须明显大于 SignalR 心跳间隔（服务端 15s）；空闲连接靠心跳保活，这里取 1 小时。
#   3. 令牌在查询串 access_token 里（浏览器 WebSocket 握手不能带 Authorization 头），因此关闭该路径的访问日志。
#   4. 后端单实例：SignalR 分组在内存中。扩成多实例前必须先加 Redis 背板，否则通知只会发到连在同一实例上的客户端。
location ^~ /api/hubs/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    access_log off;
}
