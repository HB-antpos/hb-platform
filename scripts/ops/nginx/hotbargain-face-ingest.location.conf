# hotbargain.vip 生产站点中 /face-ingest/ 的反向代理片段（人脸抓拍原始报文接收服务 hb-face-ingest，宿主机 127.0.0.1:5004）。
#
# 用途：门店海康摄像机（「应用仓库 → 人脸抓拍」）经报警主机 / HTTP 监听主动 HTTPS 推送到
#   https://hotbargain.vip/face-ingest/hik/v1/<token>
# P0 服务只校验 token、把请求体原样落盘后立刻回 200，不解析、不入库（见 docs/runbooks/face-ingest.md）。
# 这条路由被 WAF、IP 白名单或前缀改写误伤时，摄像机只会静默重试或丢事件，服务端看不到任何请求，很难定位。
#
# 使用方式：把本文件内容（两个 location 块）放进 server { } 块（443；宝塔里 80 与 443 通常是同一个块，见约束 11），然后：
#   sudo nginx -t && sudo systemctl reload nginx
# 部署后从公网（门店网络或本机，不要在服务器上）验证：
#   1) 健康检查，期望 200：
#      curl -sS -o /dev/null -w '%{http_code}\n' https://hotbargain.vip/face-ingest/health
#   2) 错误 token，期望 401（服务不读请求体、不落盘）：
#      curl -sS -o /dev/null -w '%{http_code}\n' -X POST --data-binary 'probe' \
#        https://hotbargain.vip/face-ingest/hik/v1/not-a-real-token
#   3) 正确 token + 二进制 multipart 请求体，期望 200（样本文件生成与 token 读入方式见 runbook「公网自测」）：
#      curl -sS -o /dev/null -w '%{http_code}\n' -X POST \
#        -H 'Content-Type: multipart/form-data; boundary=boundary' \
#        --data-binary @"$PROBE_FILE" "https://hotbargain.vip/face-ingest/hik/v1/$FACE_INGEST_TEST_TOKEN"
#   4) 漏写前缀，期望 404（由下面的 /hik/ 兜底块直接返回，不进访问日志）：
#      curl -sS -o /dev/null -w '%{http_code}\n' -X POST --data-binary 'probe' \
#        https://hotbargain.vip/hik/v1/not-a-real-token
#   5) 明文 HTTP，期望 403（本片段拒绝）或 301（站点开了强制 HTTPS），绝不能是 401 / 200（约束 11）：
#      curl -sS -o /dev/null -w '%{http_code}\n' -X POST --data-binary 'probe' \
#        http://hotbargain.vip/face-ingest/hik/v1/not-a-real-token
#   401 = token 不对或摄像机已停用；403 = 走了明文 HTTP，或被宝塔 WAF 拦截；404 = 前缀漏写或改写；
#   413 = 请求体超过 16m；502 = 容器没起来或端口不对；503 = 服务端落盘 IO 失败（磁盘满、权限）。
#
# 约束（改动这段配置前请先对照）：
#   1. 末尾带 "/" 的 proxy_pass 会去掉 /face-ingest/ 前缀；没有 "/" 则前缀被原样转发，服务端路由全部 404。
#      ^~ 让本前缀优先于宝塔默认的 .jpg/.js 等正则 location。
#   2. token 就在 URL 路径里，所以两个 location 都关掉 access_log，并把 error_log 指到 /dev/null：
#      error_log 可以按 location 设置，命中 location 后上游不可达（502/504，例如重建容器的几秒）和
#      请求体超限（413）都记到这里；不改的话会把含 token 的请求行和 upstream 地址写进站点 error log。
#      需要排查 Nginx 侧 413/502 时，临时改成 `error_log /www/wwwlogs/face-ingest.error.log error;`，
#      排查完改回、删除该文件，并给日志里出现过的摄像机换 token。
#      仍然管不到的：location 匹配之前就出错的请求（畸形请求头 400、server 级 http→https 跳转）和宝塔 WAF
#      自己的拦截日志，它们按站点级配置记录；这些日志可能外流时同样要换 token。
#   3. 不要加 IP 白名单：门店都在 NAT 后、出口 IP 不固定。鉴权只靠 token；服务端对鉴权失败按 X-Real-IP
#      （门店出口 IP）节流记日志——容器里看到的连接层地址是 Docker 网桥网关，所以 X-Real-IP 必须由这里写入。
#   4. client_max_body_size 16m 与服务端 FaceIngest:MaxRequestBodyBytes（16777216）对齐，改一边必须改另一边。
#      设得太小会回 413，开了断网续传的摄像机会把它当失败反复重推。
#   5. proxy_request_buffering on：先收完门店慢上行的整个请求体再一次性转给服务，避免慢连接长期占住服务端；
#      client_body_buffer_size 1m 让常见 0.1–0.6MB 的抓拍包留在内存里，少写 client_body_temp 临时文件。
#   6. 宝塔 WAF 可能把海康不规范的二进制 multipart（字面量 boundary、part 头带 Content-Length）当攻击拦截，
#      部署后必须按上面第 3 条从公网自测；被拦时只给 /face-ingest/ 加 URL 白名单，不要关整站 WAF。
#   7. 必须透传 Authorization 头（proxy_pass 默认透传，不要 proxy_set_header Authorization ""）：
#      少数固件只能用 Basic 认证携带 token。
#   8. 读写超时 30s 足够：服务端收到完整请求体后只做本地落盘，目标 1 秒内回 200，从不同步调用外部网络。
#   9. Nginx 转发时会改写摄像机原始请求的传输层信息：上游协议固定 HTTP/1.1、Connection 固定 close、
#      Host 换成 $host（小写、去端口）、分块编码被改成定长 Content-Length、Expect / TE / Keep-Alive 被去掉。
#      服务端元数据照实记录的是改写后的值，所以这里用 X-Hik-* 头把原始值带过去（服务端会原样记进元数据）。
#      值为空时 Nginx 不发送该头（「头不存在」即「摄像机没发」）；客户端自带的同名头一律被丢弃，无法伪造。
#      X-Hik-Conn-Requests 大于 1 说明摄像机复用了 keep-alive 连接。这些头都不含 token。
#  10. /hik/ 兜底块：摄像机 URL 漏写 /face-ingest 前缀时请求会落到主站（SPA 兜底对 GET 回 200、对 POST 回 405），
#      还会把含 token 的路径写进主站访问日志。这里直接 404 且不记日志，摄像机「测试」也会明确失败。
#      主站没有任何 /hik/ 路由；漏写前缀推送过的摄像机仍要换 token（见 runbook 7.2）。
#  11. 拒绝明文 HTTP：宝塔 vhost 的 listen 80 与 listen 443 在同一个 server 块里，且生产站点没开强制 HTTPS
#      （2026-10 实测 http://hotbargain.vip/api/health 直接 200），放进「443 块」的 location 同样会被明文请求命中。
#      不拒绝的话，被配成 HTTP 的摄像机「测试」和每次推送都会 200 落盘，token 与人脸图持续明文经过公网，
#      而本 location 不记日志，运维收不到任何信号。拒绝挡不住第一次明文发送（请求已经发出），
#      但能让「测试」明确失败、现场立刻改回 HTTPS。$scheme 可信：域名直接解析到源站，前面没有 CDN 终结 TLS。
#      不要改成 301 跳转：跳转前明文已经发出，摄像机是否跟随跳转重发 POST 也未证实，403 让失败更明确。
location ^~ /face-ingest/ {
    # 明文 HTTP 一律 403，不转给服务（约束 11）。if 里只有 return，是 Nginx 公认安全的写法，并继承下面的日志设置。
    if ($scheme != "https") {
        return 403;
    }

    proxy_pass http://127.0.0.1:5004/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 摄像机原始请求的传输层信息（约束 9）。
    proxy_set_header X-Hik-Client-Protocol $server_protocol;
    proxy_set_header X-Hik-Client-Host $http_host;
    proxy_set_header X-Hik-Client-Connection $http_connection;
    proxy_set_header X-Hik-Client-Transfer-Encoding $http_transfer_encoding;
    proxy_set_header X-Hik-Client-Content-Length $http_content_length;
    proxy_set_header X-Hik-Client-Expect $http_expect;
    proxy_set_header X-Hik-Conn-Requests $connection_requests;
    proxy_set_header X-Hik-Tls-Protocol $ssl_protocol;
    proxy_set_header X-Hik-Tls-Sni $ssl_server_name;

    client_max_body_size 16m;
    client_body_buffer_size 1m;
    client_body_timeout 30s;
    proxy_request_buffering on;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    access_log off;
    error_log /dev/null crit;
}

location ^~ /hik/ {
    access_log off;
    error_log /dev/null crit;
    return 404;
}
