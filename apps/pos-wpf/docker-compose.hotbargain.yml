services:
  hbpos-api:
    build:
      context: ../..
      dockerfile: apps/pos-wpf/src/Hbpos.Api/Dockerfile
    image: hbpos-api:local
    container_name: hbpos-api
    # 限制 POS 目录构建的整机影响；禁止占用 swap 拖慢主 API。
    # 2026-10-01 由 3g 提到 4g：单店单版本常驻约 600 MB，3g（GC 堆上限约 2.25 GB）在 4 店并用时 OOM。
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5003
      - ASPNETCORE_HTTP_PORTS=5003
      - DataProtection__KeysPath=/app/App_Data/DataProtectionKeys
      - CatalogSnapshot__RootPath=/app/App_Data/CatalogSnapshots
      # 约 35 万项/店：软限优先淘汰，硬限为下载租约保留约三个版本。
      - CatalogSnapshot__SoftItemCapacity=500000
      - CatalogSnapshot__HardItemCapacity=1200000
      # 保留两店原始数据，避免旧版 since 下载在两店间交替时反复全量重建。
      - CatalogSnapshot__RawArtifactCapacity=2
      # 紧急回滚时设为 false，sync-plan 将只发放 full 租约。
      - CatalogSync__DeltaEnabled=${HBPOS_CATALOG_DELTA_ENABLED:-true}
      # 整文件目录下载（第一阶段）：默认关闭；开启后新接口 /api/v1/catalog/files/* 按版本落盘到快照卷的 download-files 子目录。
      - CatalogDownloadFiles__Enabled=${HBPOS_CATALOG_FILE_DOWNLOAD_ENABLED:-false}
      # 完成容量验收后才显式开启每日预构建，避免默认触发全店负载。
      - CatalogDailyPrebuild__Enabled=${HBPOS_CATALOG_DAILY_PREBUILD_ENABLED:-false}
      - AttendanceQrDataProtection__KeysPath=/app/App_Data/AttendanceQrDataProtectionKeys
      - AttendanceQrDataProtection__LegacyProtectedKeyCutoffUtc=${ATTENDANCE_QR_LEGACY_PROTECTED_KEY_CUTOFF_UTC:-}
      - LinklyCloudCredentialDataProtection__KeysPath=/app/App_Data/LinklyCloudCredentialDataProtectionKeys
      # WPF API 主库与 POSM 库复用服务器 .env，仓库内不保存连接串明文。
      - ConnectionStrings__MainConnection=${CONNECTION_STRING_DEFAULT}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING_DEFAULT}
      - ConnectionStrings__HBPOSMConnection=${CONNECTION_STRING_POSM}
      - ConnectionStrings__PosmConnection=${CONNECTION_STRING_POSM}
      - FileLogging__Path=/app/logs/hbpos-api.log
      - CentralLogging__Enabled=true
      - CentralLogging__IngestUrl=http://hb-platform-vite-api:5002/api/system/logs/ingest
      - CentralLogging__ApiKey=${CENTER_LOG_HBPOS_API_KEY:?required}
      - CentralLogging__ProjectCode=hbpos_api
      - CentralLogging__Environment=Production
      - CentralLogging__SourceType=Backend
      - CentralLogging__ServiceName=Hbpos.Api
      - CentralLogging__MinimumLevel=Warning
      # 与中心后端共用更新检查密钥，只从服务器 .env 注入。
      - AppUpdate__CenterBaseUrl=https://hotbargain.vip/
      - AppUpdate__ServiceApiToken=${HBPOS_APP_UPDATE_DECISION_READ_TOKEN:?required}
      # 中央策略先登记并验证后再启用；关闭时原生更新继续使用 PosIpad 本地策略。
      - AppUpdate__CentralPolicyEnabled=${HBPOS_APP_UPDATE_CENTRAL_POLICY_ENABLED:-false}
      - AppUpdate__CheckApiKey=${WPF_APP_UPDATE_CHECK_API_KEY:?required}
      # 设备请求经本地授权验证后转发中心，不向收银端暴露服务间密钥。
      - RemoteMaintenance__Enabled=${REMOTE_MAINTENANCE_ENABLED:-false}
      - RemoteMaintenance__CenterBaseUrl=https://hotbargain.vip/
      - RemoteMaintenance__InterApiKey=${REMOTE_MAINTENANCE_INTER_API_KEY:-}
      - CashierAuthorization__Mode=${HBPOS_CASHIER_AUTHORIZATION_MODE:-Audit}
      # App Review 默认关闭；仅在审核窗口从服务器 .env 注入专用门店、UTC 到期时间和开通码 SHA-256。
      - PosIpadAppReview__Enabled=${HBPOS_IPAD_APP_REVIEW_ENABLED:-false}
      - PosIpadAppReview__StoreCode=${HBPOS_IPAD_APP_REVIEW_STORE_CODE:-}
      - PosIpadAppReview__ExpiresAtUtc=${HBPOS_IPAD_APP_REVIEW_EXPIRES_AT_UTC:-}
      - PosIpadAppReview__MaxActiveDevices=${HBPOS_IPAD_APP_REVIEW_MAX_ACTIVE_DEVICES:-1}
      - PosIpadAppReview__GrantId=${HBPOS_IPAD_APP_REVIEW_GRANT_ID:-}
      - PosIpadAppReview__RegistrationCodeSha256=${HBPOS_IPAD_APP_REVIEW_REGISTRATION_CODE_SHA256:-}
      # 只信任 Nginx 到容器的一跳代理地址；部署前必须按 hb-network 实际网关写入服务器 .env。
      - ReverseProxy__KnownProxies__0=${HBPOS_REVERSE_PROXY_IP:-}
      # Linkly 回调必须是公网 HTTPS；服务会在该 base 后拼接 api/v1/linkly/cloud-notifications/...
      - LinklyCloudBackendAsync__PublicNotificationBaseUrl=https://hotbargain.vip/pos-api/
      - LinklyCloudBackendAsync__ProductionNotificationBearer=${LINKLY_CLOUD_PRODUCTION_NOTIFICATION_BEARER:-}
      - LinklyCloudBackendAsync__SandboxNotificationBearer=${LINKLY_CLOUD_SANDBOX_NOTIFICATION_BEARER:-}
      - LinklyCloudBackendAsync__ProductionPosVendorId=${LINKLY_CLOUD_PRODUCTION_POS_VENDOR_ID:-}
      - LinklyCloudBackendAsync__SandboxPosVendorId=${LINKLY_CLOUD_SANDBOX_POS_VENDOR_ID:-11111111-1111-4111-8111-111111111111}
      # Square Dashboard 需要登记同一个公网 URL；签名密钥只从服务器 .env 注入。
      - Square__WebhookNotificationUrls__Production=https://hotbargainpos.com/api/v1/square/webhooks
      - Square__WebhookNotificationUrls__Sandbox=https://hotbargainpos.com/api/v1/square/webhooks
      - Square__WebhookSignatureKeys__Production=${SQUARE_WEBHOOK_SIGNATURE_KEY_PRODUCTION:-}
      - Square__WebhookSignatureKeys__Sandbox=${SQUARE_WEBHOOK_SIGNATURE_KEY_SANDBOX:-}
    volumes:
      - hbpos-api-logs:/app/logs
      # POS 全局票据 ring 独立持久化，不得复用主 backend 的全局 ring。
      - hbpos-api-data-protection-keys:/app/App_Data/DataProtectionKeys
      # 目录版本快照独立持久化；容器重启后可恢复最近可校验版本。
      - hbpos-api-catalog-snapshots:/app/App_Data/CatalogSnapshots
      # 考勤 ring 必须显式挂载到主 backend 共用的宿主机目录，缺失时拒绝启动 compose。
      - ${ATTENDANCE_QR_DATA_PROTECTION_KEYS_HOST_PATH:?required}:/app/App_Data/AttendanceQrDataProtectionKeys
      # Linkly 终端凭据 ring 与 Admin 共用，缺失宿主挂载时拒绝启动 compose。
      - ${LINKLY_CLOUD_CREDENTIAL_DATA_PROTECTION_KEYS_HOST_PATH:?required}:/app/App_Data/LinklyCloudCredentialDataProtectionKeys
    restart: unless-stopped
    # Docker 默认 json-file 驱动不轮转，匿名回调端点被扫描时会无限增长；与应用内 FileLogging 轮转配合限制磁盘占用。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - hb-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5003/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  hb-network:
    external: true
    name: hb-network

volumes:
  hbpos-api-logs:
    driver: local
  hbpos-api-data-protection-keys:
    driver: local
  hbpos-api-catalog-snapshots:
    driver: local
