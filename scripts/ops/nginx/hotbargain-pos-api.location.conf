# hotbargain.vip 生产站点中 /pos-api/ 的反向代理片段（收银后端 hbpos-api，宿主机端口 5003）。
#
# 为什么放进仓库：Linkly 云支付的回调（display 按键提示、receipt 回单）走
#   https://hotbargain.vip/pos-api/api/v1/linkly/cloud-notifications/{environment}/{sessionId}/{type}
# 该路由一旦被 WAF、IP 白名单或前缀改写误伤，设备 API 仍然正常、交易结果仍能靠轮询拿到，
# 但按键提示和回单会静默丢失，且很难定位。之前这段配置只存在于服务器上（宝塔面板
# /www/server/panel/vhost/nginx/www.hotbargain.vip.conf），没有任何版本管理。
#
# 使用方式：把本文件内容放进 server { } 块（443），然后：
#   sudo nginx -t && sudo systemctl reload nginx
# 部署后验证（POS 的健康检查也会自探测，见 docs/production-server-migration-handover.md §9.8）：
#   curl -sS -o /dev/null -w '%{http_code}\n' -X POST \
#     -H "Authorization: Bearer $LINKLY_CLOUD_PRODUCTION_NOTIFICATION_BEARER" \
#     -H 'Content-Type: application/json' -d '{}' \
#     "https://hotbargain.vip/pos-api/api/v1/linkly/cloud-notifications/Production/$(uuidgen)/display"
#   期望 200（随机 sessionId 不存在，POS 鉴权通过后直接忽略，不写库）；
#   401 = Authorization 头被代理层吞掉或 bearer 不一致；403/404 = 被 WAF/白名单/前缀改写拦截。
#
# 约束（改动这段配置前请先对照）：
#   1. 末尾带 "/" 的 proxy_pass 会去掉 /pos-api/ 前缀；没有 "/" 则前缀会被原样转发，POS 路由全部 404。
#   2. 不要给这个 location 加 IP 白名单：Linkly 的回调来自其云端出口 IP，我们无法穷举。
#      回调鉴权靠 Authorization bearer（POS 侧对无效鉴权按来源 IP 限流，真实回调不受影响）。
#   3. 必须透传 Authorization 头（proxy_pass 默认透传，不要 proxy_set_header Authorization ""）。
#   4. proxy_read_timeout 必须不低于 POS 调 Linkly 的 HTTP 超时（LinklyTimeoutConstants.HttpTimeout = 240s），
#      否则刷卡长轮询会被 Nginx 先掐断。这里取 300s。
#   5. X-Forwarded-For / X-Forwarded-Proto 必须带上：POS 用 ForwardedHeaders 取真实来源 IP 做限流，
#      并要求 compose 里 HBPOS_REVERSE_PROXY_IP 填本机 Nginx 到容器的来源 IP（见 docker-compose.hotbargain.yml）。
location ^~ /pos-api/ {
    proxy_pass http://127.0.0.1:5003/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
